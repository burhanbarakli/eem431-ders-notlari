<text class="umb-mono umb-b" x="26" y="76">UARTLCRH</text>
<text class="umb-s13" x="114" y="76">WLEN, STP2, PEN, EPS, FEN</text>
<text class="umb-mono umb-b" x="26" y="96">UARTCTL</text>
<text class="umb-s13" x="114" y="96">UARTEN, TXE, RXE, HSE, EOT</text>
<text class="umb-mono umb-b" x="26" y="116">UARTFR</text>
