<text x="12" y="22"><tspan class="umb-s16 umb-b">UART modülü</tspan><tspan class="umb-s15"> — sadeleştirilmiş; UART0–UART7 aynı yapıda (RTS/CTS yalnız UART1)</tspan></text>
