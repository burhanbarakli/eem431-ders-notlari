<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" class="umb-svg" role="img" aria-labelledby="umb-title umb-desc">
<title id="umb-title">UART modülü blok şeması</title>
<desc id="umb-desc">Sadeleştirilmiş UART modülü (datasheet Şekil 14-1’in yeniden çizimi); sekiz modül aynı yapıda, RTS/CTS yalnız UART1’de. Saat: sistem saati ya da PIOSC, UARTCC.CS ile seçilir (0x0 sistem, 0x5 PIOSC) ve UARTIBRD/UARTFBRD bölücülü baud üretecine gider; üreteç Baud16 (HSE = 1 ise Baud8) saatini gönderici ve alıcıya verir. Gönderici: UARTDR yazması TX FIFO’ya (16 × 8), oradan kaydırma yazmacına ve UnTx pinine. Alıcı: UnRx pininden kaydırma yazmacına, oradan RX FIFO’ya (16 × (8 + 4): 8 veri + 4 hata biti OE, BE, PE, FE) ve UARTDR okumasına. Denetim: UARTLCRH, UARTCTL, UARTIFLS, UARTFR, UARTRSR/ECR. Kesme: UARTRIS, UARTIM ile maskelenir, UARTMIS NVIC’e gider, UARTICR’ye 1 yazarak silinir; kesme kaynakları TX FIFO, RX FIFO ve alıcıdan gelir. μDMA istekleri UARTDMACTL ile açılır. UART0 kesmesi IRQ 5 (vektör 21).</desc>
<defs>
<marker id="umb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="umb-head" d="M0,0 L10,5 L0,10 z"/></marker>
