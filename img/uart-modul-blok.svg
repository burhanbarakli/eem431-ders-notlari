<text x="26" y="512" xml:space="preserve"><tspan class="umb-mono umb-b">UARTICR</tspan><tspan class="umb-s13">  bite 1 yaz → RIS ve MIS silinir (W1C, </tspan><tspan class="umb-mono">=</tspan><tspan class="umb-s13"> ile yaz)</tspan></text>
<text class="umb-s13 umb-mut" x="26" y="530">EOT ayrı olay değil: UARTCTL.EOT = 1 ise TX kesmesi son bit çıkınca kalkar</text>
