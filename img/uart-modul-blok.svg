<text class="umb-mono umb-b" x="332" y="76">UARTIFLS</text>
<text class="umb-s13" x="436" y="76">FIFO eşikleri</text>
<text class="umb-mono umb-b" x="332" y="96">UARTRSR/ECR</text>
<text class="umb-s13" x="436" y="96">hata durumu</text>
<text class="umb-mono umb-b" x="332" y="116">UARTCC</text>
<text class="umb-s13" x="436" y="116">saat kaynağı</text>
<rect class="umb-box" x="556" y="34" width="192" height="90" rx="6"/>
<text x="566" y="54"><tspan class="umb-b">μDMA istekleri</tspan></text>
<text class="umb-s13" x="566" y="72">TX ve RX FIFO’dan, ayrı kanal</text>
<text class="umb-s13" x="566" y="90">tek / burst (FIFO eşiğine göre)</text>
<text class="umb-s13" x="566" y="108">açma: UARTDMACTL</text>
<rect class="umb-box" x="16" y="142" width="124" height="220" rx="6"/>
<text class="umb-mono umb-b" x="78" y="162" text-anchor="middle">UARTDR</text>
<text class="umb-s13 umb-mut" x="78" y="178" text-anchor="middle">ofset 0x000</text>
<text class="umb-s13 umb-b" x="26" y="206">yazma:</text>
<text class="umb-s13" x="26" y="222">8 bit → TX FIFO</text>
<text class="umb-s13 umb-b" x="26" y="270">okuma: 12 bit</text>
<text class="umb-s13" x="26" y="288">bit 7:0 veri</text>
<text class="umb-s13" x="26" y="306">bit 8 FE · 9 PE</text>
<text class="umb-s13" x="26" y="322">bit 10 BE · 11 OE</text>
<text class="umb-s13 umb-mut" x="78" y="352" text-anchor="middle">işlemci (APB)</text>
<rect class="umb-box" x="176" y="142" width="144" height="60" rx="6"/>
<text class="umb-b" x="186" y="161">TX FIFO</text>
<text class="umb-mono" x="310" y="161" text-anchor="end">16×8</text>
