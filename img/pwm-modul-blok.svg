<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 758" class="pwmb-svg" role="img" aria-labelledby="pwmb-title pwmb-desc">
<title id="pwmb-title">PWM saat yolu, modül yapısı ve LaunchPad pinleri (sadeleştirilmiş)</title>
<desc id="pwmb-desc">Veri sayfası Şekil 20-1 ve 20-2’ye dayalı sade şema. Sistem saati PWM saatine iki yoldan gider: RCC.USEPWMDIV = 0 ise doğrudan, 1 ise PWMDIV bölücüsünden (RCC bit 19:17; ÷2, 4, 8, 16, 32, 64). Bölücü iki PWM modülü için ortaktır. Notun 5.1 örneğinde 16 MHz ÷ 2 = 8 MHz, 5.3’te bölücüsüz 16 MHz, Workbook Lab 15’te 40 MHz ÷ 64 = 625 kHz kullanılır. Her modülde dört üreteç vardır. Açık çizilen üreteç 0: 16 bit sayaç (PWM0LOAD, PWM0COUNT, PWM0CTL) load, zero ve dir sinyallerini; karşılaştırıcılar (PWM0CMPA, PWM0CMPB) cmpA ve cmpB sinyallerini üretir. Sinyal üreteci (PWM0GENA, PWM0GENB) bu olaylara göre pwmA ve pwmB’yi kurar. Ölü bant üreteci (PWM0DBCTL) isteğe bağlıdır, kapalıyken sinyalleri aynen geçirir. Çıkış denetimi (PWMENABLE, PWMINVERT) hangi sinyalin pine gideceğini ve tersini seçer. PWM0 üreteç 0 çıkışları M0PWM0 = PB6 ve M0PWM1 = PB7 (PCTL 4). PWM1’de üreteç 0 → M1PWM0 = PD0 (Lab 15 servo, J3.03) ve M1PWM1 = PD1; üreteç 2 → M1PWM5 = PF1 kırmızı LED; üreteç 3 → M1PWM6 = PF2 mavi LED, M1PWM7 = PF3 yeşil LED (PCTL 5). LaunchPad’de PB6–PD0 R9, PB7–PD1 R10 ile 0 Ω bağlıdır. Hata girişi, kesme/ADC tetikleyici ve kullanılmayan üreteçler soluk çizilmiştir.</desc>
<defs>
