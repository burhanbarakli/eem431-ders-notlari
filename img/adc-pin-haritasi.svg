<text class="aph-s13 aph-mut" x="12" y="416">Kaynak: datasheet Tablo 13-1; spmu296 Tablo 2-3…2-5</text>
<text class="aph-b" x="372" y="54">Örnek: potansiyometre → PE3 (AIN0)</text>
<text x="432" y="78" text-anchor="middle" xml:space="preserve"><tspan class="aph-s13 aph-b">3,3 V</tspan><tspan class="aph-s13 aph-mut">  (J1.01)</tspan></text>
