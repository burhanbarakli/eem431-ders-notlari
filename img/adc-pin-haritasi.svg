<path class="aph-w" d="M658,214 H700 V246" marker-end="url(#aph-arr)"/>
<text class="aph-mono aph-b aph-grn" x="664" y="206">AMSEL = 1</text>
<text class="aph-s13 aph-mut" x="644" y="232" text-anchor="middle">izolasyon</text>
<rect class="aph-box" x="626" y="248" width="112" height="44" rx="6"/>
<text class="aph-s13 aph-b" x="682" y="266" text-anchor="middle">ADC çoklayıcı</text>
<text class="aph-mono" x="682" y="284" text-anchor="middle">AIN0</text>
<text x="594" y="308"><tspan class="aph-mono">AFSEL = 1</tspan><tspan class="aph-s13 aph-mut"> (§13.4.1/3)</tspan></text>
<text x="372" y="342" xml:space="preserve"><tspan class="aph-s13">V</tspan><tspan class="aph-sub" dy="4">in</tspan><tspan class="aph-s13" dy="-4"> = 3,3 V · R</tspan><tspan class="aph-sub" dy="4">alt</tspan><tspan class="aph-s13" dy="-4"> / 10 kΩ  </tspan><tspan class="aph-s13 aph-mut">(R</tspan><tspan class="aph-sub aph-mut" dy="4">alt</tspan><tspan class="aph-s13 aph-mut" dy="-4">: orta uç–GND arası)</tspan></text>
<text class="aph-s13" x="372" y="360">orta konum: 1,65 V → kod ≈ 2048 (0x800)</text>
<text class="aph-s13" x="372" y="378">uçlarda: 0 V → 0, 3,3 V → 4095 (0xFFF)</text>
<text x="12" y="460"><tspan class="aph-s15 aph-b">PE3’ü analog giriş yapmak</tspan><tspan class="aph-s13 aph-mut"> (her AIN pini için aynı adımlar, ilgili port/bit ile)</tspan></text>
<rect class="aph-box" x="12" y="472" width="736" height="26"/>
<text x="22" y="490" xml:space="preserve"><tspan class="aph-s13 aph-b aph-acc">1  </tspan><tspan class="aph-mono aph-b">RCGCGPIO</tspan></text>
<text class="aph-mono" x="158" y="490">SYSCTL_RCGCGPIO_R |= 0x10;</text>
<text class="aph-s13" x="428" y="490">Port E saati (bit 4), hazır bekle: PRGPIO</text>
<rect class="aph-box" x="12" y="498" width="736" height="26"/>
<text x="22" y="516" xml:space="preserve"><tspan class="aph-s13 aph-b aph-acc">2  </tspan><tspan class="aph-mono aph-b">GPIOAFSEL</tspan></text>
<text class="aph-mono" x="158" y="516">GPIO_PORTE_AFSEL_R |= 0x08;</text>
<text class="aph-s13" x="428" y="516">alternatif işlev (datasheet §13.4.1 adım 3)</text>
<rect class="aph-box" x="12" y="524" width="736" height="26"/>
<text x="22" y="542" xml:space="preserve"><tspan class="aph-s13 aph-b aph-acc">3  </tspan><tspan class="aph-mono aph-b">GPIODEN</tspan></text>
<text class="aph-mono" x="158" y="542">GPIO_PORTE_DEN_R &amp;= ~0x08;</text>
<text class="aph-s13" x="428" y="542">dijital tampon kapalı</text>
<rect class="aph-box" x="12" y="550" width="736" height="26"/>
<text x="22" y="568" xml:space="preserve"><tspan class="aph-s13 aph-b aph-acc">4  </tspan><tspan class="aph-mono aph-b">GPIOAMSEL</tspan></text>
<text class="aph-mono" x="158" y="568">GPIO_PORTE_AMSEL_R |= 0x08;</text>
<text class="aph-s13" x="428" y="568">analog izolasyon kalkar → pin ADC’ye bağlanır</text>
<path class="aph-sep" d="M150,472 L150,576"/>
<path class="aph-sep" d="M420,472 L420,576"/>
<rect class="aph-code" x="12" y="586" width="736" height="82" rx="6"/>
<text x="22" y="606"><tspan class="aph-s13 aph-b">TivaWare: </tspan><tspan class="aph-mono">SysCtlPeripheralEnable(SYSCTL_PERIPH_GPIOE);</tspan></text>
<text x="22" y="625" xml:space="preserve"><tspan class="aph-s13">          </tspan><tspan class="aph-mono aph-b">GPIOPinTypeADC(GPIO_PORTE_BASE, GPIO_PIN_3);</tspan></text>
<text x="22" y="643"><tspan class="aph-mono">GPIOPinTypeADC</tspan><tspan class="aph-s13"> → DIR = 0, AFSEL = 0, PUR = PDR = 0, DEN = 0, AMSEL = 1</tspan></text>
<text class="aph-s13 aph-mut" x="22" y="660">(datasheet adım 3’ün tersine AFSEL’i siler; bağlantı AMSEL ile kurulduğu için çalışır)</text>
<rect class="aph-hl" x="12" y="680" width="736" height="104" rx="6"/>
<text x="24" y="701"><tspan class="aph-b aph-acc">Dikkat: giriş aralığı 0 – 3,3 V. </tspan><tspan class="aph-s13">Doğru dönüşüm 0 ≤ </tspan><tspan class="aph-s13">V</tspan><tspan class="aph-sub" dy="4">in</tspan><tspan class="aph-s13" dy="-4"> ≤ VDDA = VREFP (Tablo 24-33); üstünde kod </tspan><tspan class="aph-mono">0xFFF</tspan><tspan class="aph-s13">’te doyar.</tspan></text>
<text x="24" y="721"><tspan class="aph-s13 aph-b">Datasheet çelişkili: </tspan><tspan class="aph-s13">s. 650: koruma var, 5,5 V’a dek hasar yok (Tablo 24-1); s. 1329: AINx 5-V tolerant değil.</tspan></text>
<text x="24" y="740"><tspan class="aph-s13 aph-b">Güvenli taraf: </tspan><tspan class="aph-s13">AINx’e VDDA’dan yüksek gerilim vermeyin; ölçüm zaten yalnız 0–VDDA’da geçerli.</tspan></text>
<text x="24" y="759"><tspan class="aph-s13">Kaynak direnci </tspan><tspan class="aph-s13">R</tspan><tspan class="aph-sub" dy="4">S</tspan><tspan class="aph-s13" dy="-4"> ≤ 500 Ω (Tablo 24-33); 10 kΩ pot orta konumda ≈ 2,5 kΩ olur →</tspan></text>
<text class="aph-s13" x="24" y="777">orta uçtan GND’ye 100 nF süzme kondansatörü ya da düşük örnekleme hızı/ortalama yardımcı olur.</text>
</svg>
