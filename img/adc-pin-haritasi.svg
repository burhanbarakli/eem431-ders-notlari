<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 794" class="aph-svg" role="img" aria-labelledby="aph-title aph-desc">
<title id="aph-title">AIN kanal–pin eşlemesi ve potansiyometre örneği</title>
<desc id="aph-desc">Tablo: AIN0 PE3 (kılıf pini 6, LaunchPad J3.09), AIN1 PE2 (7, J3.08), AIN2 PE1 (8, J3.07), AIN3 PE0 (9, J2.03), AIN4 PD3 (64, J3.06), AIN5 PD2 (63, J3.05), AIN6 PD1 (62, J3.04), AIN7 PD0 (61, J3.03), AIN8 PE5 (60, J1.06), AIN9 PE4 (59, J1.05), AIN10 PB4 (58, J1.07), AIN11 PB5 (57, J1.02). PD0/PD1 kartta 0 Ω R9/R10 ile PB6/PB7’ye de bağlıdır. Devre: 10 kΩ potansiyometre 3,3 V (J1.01) ile GND arasında, orta uç PE3/AIN0’a (J3.09) gider; isteğe bağlı 100 nF süzme kondansatörü. Çip içinde DEN = 0 dijital tamponu kapatır, AMSEL = 1 analog izolasyon anahtarını kapatıp pini ADC çoklayıcısına bağlar. Altta Port E saati, GPIOAFSEL, GPIODEN, GPIOAMSEL ayarları ve TivaWare GPIOPinTypeADC karşılığı (DIR = 0, AFSEL = 0, DEN = 0, AMSEL = 1); uyarı: giriş 0–3,3 V, 5 V toleransı konusunda datasheet çelişkili olduğundan AINx’e VDDA üstü gerilim verilmemeli, kaynak direnci ≤ 500 Ω.</desc>
<defs>
<marker id="aph-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="aph-head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
