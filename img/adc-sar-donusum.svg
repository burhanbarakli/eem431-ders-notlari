<text x="12" y="340"><tspan class="asr-b">3.</tspan><tspan class="asr-s13"> </tspan><tspan class="asr-s13">V</tspan><tspan class="asr-sub asr-s13" dy="4">in</tspan><tspan class="asr-s13" dy="-4"> ≥ </tspan><tspan class="asr-s13">V</tspan><tspan class="asr-sub asr-s13" dy="4">DAC</tspan><tspan class="asr-s13" dy="-4"> ise bit 1 kalır, değilse 0; n bit = n adım.</tspan></text>
