<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 802" class="asr-svg" role="img" aria-labelledby="asr-title asr-desc">
<title id="asr-title">SAR dönüşüm ilkesi ve 12-bit aktarım fonksiyonu</title>
<desc id="asr-desc">(a) Ardışık yaklaşım: örnekle-tut devresi girişi tutar, SAR yazmacı en anlamlı bitten başlayarak her biti dener, DAC deneme kodunu VDAC gerilimine çevirir, karşılaştırıcı Vin ≥ VDAC ise biti 1 bırakır. 4-bit örnek: Vin = 1,0 V, VREF = 3,3 V; denemeler 1000 (1,650 V, bit3 = 0), 0100 (0,825 V, bit2 = 1), 0110 (1,238 V, bit1 = 0), 0101 (1,031 V, bit0 = 0), sonuç 0100 = 4. 12 bitte kod 1241 = 0x4D9 ve ilk 4 bit yine 0100. (b) 12-bit aktarım fonksiyonu: kod = taban(Vin · 4096 / 3,3), 0x000 VREFN’ye, 0xFFF VREFP’ye karşılık gelir, VREFP üstünde doyma; 1 LSB = 3,3/4096 ≈ 0,806 mV. Büyütülmüş pencerede 1,0 V çevresinde basamaklar ve nicemleme hatası (kod basamak ortası olarak yorumlanırsa ±½ LSB) gösterilir.</desc>
