<text x="204" y="594"><tspan class="aos-s13 aos-mut">nibble </tspan><tspan class="aos-mono">0x8</tspan></text>
<rect class="aos-box2" x="142" y="610" width="108" height="28"/>
<text class="aos-s13" x="196" y="629" text-anchor="middle">2. sonuç</text>
<rect class="aos-box" x="272" y="522" width="108" height="50" rx="6"/>
<text class="aos-s13 aos-b" x="326" y="541" text-anchor="middle">adım 2</text>
<text class="aos-mono" x="326" y="561" text-anchor="middle">TS</text>
<path class="aos-w" d="M380,547 L400,547" marker-end="url(#aos-arr)"/>
<path class="aos-w" d="M326,572 L326,608" marker-end="url(#aos-arr)"/>
<text x="334" y="594"><tspan class="aos-s13 aos-mut">nibble </tspan><tspan class="aos-mono">0x8</tspan></text>
<rect class="aos-box2" x="272" y="610" width="108" height="28"/>
<text class="aos-s13" x="326" y="629" text-anchor="middle">3. sonuç</text>
<rect class="aos-hl" x="402" y="522" width="108" height="50" rx="6"/>
<text class="aos-s13 aos-b" x="456" y="541" text-anchor="middle">adım 3</text>
<text class="aos-mono aos-b" x="456" y="561" text-anchor="middle">TS|IE|END</text>
<path class="aos-w" d="M456,572 L456,608" marker-end="url(#aos-arr)"/>
<text x="464" y="594"><tspan class="aos-s13 aos-mut">nibble </tspan><tspan class="aos-mono">0xE</tspan></text>
<rect class="aos-box2" x="402" y="610" width="108" height="28"/>
<text class="aos-s13" x="456" y="629" text-anchor="middle">4. sonuç</text>
<text x="12" y="656"><tspan class="aos-mono aos-b">ADCSSFIFO1</tspan><tspan class="aos-s13"> — 4 derinlikli FIFO; her okuma bir sonucu çeker (alt 12 bit)</tspan></text>
<path class="aos-wa" d="M510,547 L538,547" marker-end="url(#aos-arra)"/>
<rect class="aos-hl" x="540" y="522" width="208" height="50" rx="6"/>
<text x="550" y="542" xml:space="preserve"><tspan class="aos-mono aos-b">INR1 = 1</tspan><tspan class="aos-s13">  (ADCRIS bit 1)</tspan></text>
<text class="aos-s13" x="550" y="561">yoklama ya da kesme ile görülür</text>
<text x="540" y="598"><tspan class="aos-mono">ADCSSCTL1 = </tspan><tspan class="aos-mono aos-b aos-acc">0x0000E888</tspan></text>
<text class="aos-s13" x="540" y="616">adım 3, 2, 1, 0 = E, 8, 8, 8</text>
<text x="540" y="636"><tspan class="aos-mono">ADCSSMUX1</tspan><tspan class="aos-s13"> = 0 (TS = 1 iken</tspan></text>
<text class="aos-s13" x="540" y="653">MUX alanı yok sayılır)</text>
