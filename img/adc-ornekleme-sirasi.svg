<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" class="aos-svg" role="img" aria-labelledby="aos-title aos-desc">
<title id="aos-title">Örnekleme sıralayıcısı adım alanları</title>
<desc id="aos-desc">ADCSSMUXn: her adım için 4-bit kanal alanı, MUX0 bit 3:0 … MUX7 bit 31:28 (SS0 sekiz alan, SS1/SS2 MUX3–MUX0, SS3 yalnız MUX0). ADCSSCTLn: her adım için 4 bit, adım k için TSk = bit 4k+3, IEk = 4k+2, ENDk = 4k+1, Dk = 4k; TivaWare ADC_CTL_TS 0x80, ADC_CTL_IE 0x40, ADC_CTL_END 0x20, ADC_CTL_D 0x10 bu nibble’a kaydırılır. (a) SS3 tek adım: TS ile ADCSSCTL3 = 0xE (TS0|IE0|END0), AIN0 ile ADCSSMUX3 = 0 ve ADCSSCTL3 = 0x6. (b) Workbook Lab 5: SS1’in 4 adımı sıcaklık sensörünü okur, son adımda IE ve END; ADCSSCTL1 = 0xE888. Dört sonuç sırayla ADCSSFIFO1’e yazılır ve son adımda INR1 kurulur.</desc>
<defs>
<marker id="aos-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="aos-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="aos-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="aos-heada" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
