<text class="pwmv-m12 pwmv-mut" x="333.6" y="428" text-anchor="middle">0,5</text>
<path class="pwmv-wm" d="M431.20000000000005,406 L431.20000000000005,414"/>
<text class="pwmv-m12 pwmv-mut" x="431.2" y="428" text-anchor="middle">1,0</text>
<path class="pwmv-wm" d="M528.8,406 L528.8,414"/>
<text class="pwmv-m12 pwmv-mut" x="528.8" y="428" text-anchor="middle">1,5</text>
<path class="pwmv-wm" d="M626.4000000000001,406 L626.4000000000001,414"/>
<text class="pwmv-m12 pwmv-mut" x="626.4" y="428" text-anchor="middle">2,0</text>
<path class="pwmv-wm" d="M724.0,406 L724.0,414"/>
<text class="pwmv-m12 pwmv-mut" x="724" y="428" text-anchor="middle">2,5</text>
<text class="pwmv-s12 pwmv-mut" x="218" y="428" text-anchor="end">ms</text>
<path class="pwmv-w" d="M520.8000000000001,470 L432.20000000000005,470" marker-end="url(#pwmv-arr)"/>
