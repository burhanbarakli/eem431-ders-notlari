<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" class="pwmv-svg" role="img" aria-labelledby="pwmv-title pwmv-desc">
<title id="pwmv-title">Servo denetimi (Workbook Lab 15): 55 Hz, 1–2 ms darbe</title>
<desc id="pwmv-desc">Sistem saati 40 MHz, PWMDIV ÷64 → PWM saati 625 kHz (1 tık = 1,6 µs). ui32Load = 625 000 / 55 − 1 = 11 362; PWMGenPeriodSet bunu periyot olarak alır, LOAD = 11 361; periyot 11 362 tık ≈ 18,18 ms, ≈ 55 Hz. Darbe genişliği ui8Adjust × 11 362 / 1000 tık: 56 → 636 tık ≈ 1,02 ms (bir uç), 83 → 943 tık ≈ 1,51 ms (orta), 111 → 1261 tık ≈ 2,02 ms (öbür uç). Üstte iki periyot gerçek ölçekte: darbe periyodun ancak %5–11’i kadardır. Altta ilk 2,5 ms büyütülmüştür. SW1 (PF4) basılı tutulursa ui8Adjust her döngüde 1 azalır (alt sınır 56), SW2 (PF0) basılıysa 1 artar (üst sınır 111). Bir adım ≈ 11,4 tık ≈ 18,2 µs. Çıkış PD0 = M1PWM0 (LaunchPad J3.03).</desc>
<defs>
<marker id="pwmv-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="pwmv-head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
.pwmv-svg{font-family:"Source Sans 3",system-ui,sans-serif}
.pwmv-svg text{fill:var(--fig-stroke,#2b2b29);font-size:14px}
.pwmv-svg .pwmv-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-variant-ligatures:none}
.pwmv-svg .pwmv-m12{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-variant-ligatures:none}
.pwmv-svg .pwmv-b{font-weight:700}
.pwmv-svg .pwmv-s12{font-size:12px}
.pwmv-svg .pwmv-s13{font-size:13px}
.pwmv-svg .pwmv-s16{font-size:16px}
.pwmv-svg .pwmv-mut{fill:var(--fig-muted,#76746c)}
.pwmv-svg .pwmv-acc{fill:var(--fig-accent,#b4481f)}
.pwmv-svg .pwmv-boxm{fill:var(--fig-fill,#ffffff);stroke:var(--fig-muted,#76746c);stroke-width:1.2}
.pwmv-svg .pwmv-head{fill:var(--fig-stroke,#2b2b29)}
.pwmv-svg .pwmv-w{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.6}
.pwmv-svg .pwmv-wm{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1.4}
.pwmv-svg .pwmv-grid{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:.8;stroke-dasharray:2 4}
.pwmv-svg .pwmv-wva{fill:none;stroke:var(--fig-accent,#b4481f);stroke-width:2.2;stroke-linejoin:round}
.pwmv-svg .pwmv-tintm{fill:var(--fig-muted,#76746c);fill-opacity:.2;stroke:none}
</style>
<text class="pwmv-s16 pwmv-b" x="16" y="29">Servo denetimi (Workbook Lab 15): 55 Hz, 1–2 ms darbe</text>
<text x="16" y="50"><tspan class="pwmv-s13 pwmv-mut">40 MHz ÷ 64 = 625 kHz PWM saati (1 tık = 1,6 µs) · aşağı sayma · çıkış </tspan><tspan class="pwmv-m12 pwmv-mut">PD0</tspan><tspan class="pwmv-s13 pwmv-mut"> = </tspan><tspan class="pwmv-m12 pwmv-mut">M1PWM0</tspan><tspan class="pwmv-s13 pwmv-mut"> (J3.03)</tspan></text>
<text class="pwmv-s13 pwmv-b" x="16" y="86">Gerçek ölçek, iki periyot (ui8Adjust = 83):</text>
<rect class="pwmv-tintm" x="106" y="110" width="46.5055" height="44" rx="3"/>
