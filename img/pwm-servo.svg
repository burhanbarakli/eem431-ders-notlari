<text x="423.2" y="475" text-anchor="end"><tspan class="pwmv-s13 pwmv-b">SW1 (</tspan><tspan class="pwmv-m12 pwmv-b">PF4</tspan><tspan class="pwmv-s13 pwmv-b">): </tspan><tspan class="pwmv-m12">ui8Adjust--</tspan></text>
<text class="pwmv-s12" x="423.2" y="492" text-anchor="end">alt sınır 56</text>
<text x="634.4" y="475"><tspan class="pwmv-s13 pwmv-b">SW2 (</tspan><tspan class="pwmv-m12 pwmv-b">PF0</tspan><tspan class="pwmv-s13 pwmv-b">): </tspan><tspan class="pwmv-m12">++</tspan></text>
<text class="pwmv-s12" x="634.4" y="492">üst sınır 111</text>
<text class="pwmv-s12 pwmv-mut" x="528.8" y="492" text-anchor="middle">basılıyken her döngüde 1 adım</text>
<text x="16" y="522" xml:space="preserve"><tspan class="pwmv-s13">1 adım = 11 362 / 1000 ≈ 11,4 tık ≈ 18,2 µs</tspan><tspan class="pwmv-s12 pwmv-mut">  (tamsayı bölme: adımlar 11 ya da 12 tık)</tspan></text>
</svg>
