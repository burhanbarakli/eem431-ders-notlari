<text x="16" y="269"><tspan class="pwmv-s12 pwmv-mut">56 × 11 362 / 1000</tspan></text>
<text x="16" y="285"><tspan class="pwmv-s12 pwmv-mut">= 636</tspan><tspan class="pwmv-s12 pwmv-mut"> tık</tspan></text>
<text x="442.636" y="255" xml:space="preserve"><tspan class="pwmv-s13 pwmv-b pwmv-acc">1,02 ms</tspan><tspan class="pwmv-s12">  bir uç</tspan></text>
<path class="pwmv-wva" d="M236,332 L236,306 L530.51776,306 L530.51776,332 L724,332"/>
<text x="16" y="316"><tspan class="pwmv-m12">ui8Adjust</tspan><tspan class="pwmv-m12 pwmv-b"> = 83</tspan></text>
<text x="16" y="333"><tspan class="pwmv-s12 pwmv-mut">83 × 11 362 / 1000</tspan></text>
<text x="16" y="349"><tspan class="pwmv-s12 pwmv-mut">= 943</tspan><tspan class="pwmv-s12 pwmv-mut"> tık</tspan></text>
<text x="538.518" y="319" xml:space="preserve"><tspan class="pwmv-s13 pwmv-b pwmv-acc">1,51 ms</tspan><tspan class="pwmv-s12">  orta</tspan></text>
<path class="pwmv-wva" d="M236,396 L236,370 L629.83552,370 L629.83552,396 L724,396"/>
<text x="16" y="380"><tspan class="pwmv-m12">ui8Adjust</tspan><tspan class="pwmv-m12 pwmv-b"> = 111</tspan></text>
<text x="16" y="397"><tspan class="pwmv-s12 pwmv-mut">111 × 11 362 / 1000</tspan></text>
<text x="16" y="413"><tspan class="pwmv-s12 pwmv-mut">= 1261</tspan><tspan class="pwmv-s12 pwmv-mut"> tık</tspan></text>
<text x="637.836" y="383" xml:space="preserve"><tspan class="pwmv-s13 pwmv-b pwmv-acc">2,02 ms</tspan><tspan class="pwmv-s12">  öbür uç</tspan></text>
<path class="pwmv-wm" d="M236,410 L724,410"/>
<path class="pwmv-wm" d="M236.0,406 L236.0,414"/>
