<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 632" class="usg-svg" role="img" aria-labelledby="usg-title usg-desc">
<title id="usg-title">Çevre birimi saat geçitleme: RCGC, SCGC, DCGC ve RCC.ACG</title>
<desc id="usg-desc">GPIOF örneği. Üç geçitleme biti: RCGCGPIO bit 5 (ofset 0x608, TivaWare SysCtlPeripheralEnable), SCGCGPIO bit 5 (ofset 0x708, SysCtlPeripheralSleepEnable), DCGCGPIO bit 5 (ofset 0x808, SysCtlPeripheralDeepSleepEnable). RCC register’ındaki ACG biti (bit 27, reset 0; SysCtlPeripheralClockGating) iki seçiciyi yönetir: Sleep’te ACG = 1 ise SCGC biti, ACG = 0 ise RCGC biti kullanılır; Deep-Sleep’te ACG = 1 ise DCGC biti, ACG = 0 ise RCGC biti. Run’da her zaman RCGC biti kullanılır. Mod seçicisinin çıkışı bir VE kapısında sistem saatiyle birleşir ve GPIOF modül saatini verir. Sistem saati Run ve Sleep’te RCC/RCC2 ile seçilen kaynaktır (Sleep’te Run ile aynı kaynak ve frekans); Deep-Sleep’te DSLPCLKCFG ile seçilir: DSOSCSRC kaynağı (MOSC, PIOSC, LFIOSC ya da Hibernation modülünün 32,768 kHz osilatörü) ve DSDIVORIDE bölücüsü. PLL çalışıyorsa Deep-Sleep girişinde donanım kapatır; çıkışta sistem saati önce eski kaynak ve frekansa döner, sonra durdurulan saatler açılır. İşlemci ve bellek saati Sleep ve Deep-Sleep’te durur.</desc>
<defs>
<marker id="usg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="usg-head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
