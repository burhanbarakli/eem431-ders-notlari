<text class="usg-s16 usg-b" x="16" y="29">Çevre birimi saat geçitleme (GPIOF örneği)</text>
<text x="744" y="29" text-anchor="end" xml:space="preserve"><tspan class="usg-s13 usg-b">düz</tspan><tspan class="usg-s13"> = register   </tspan><tspan class="usg-s13 usg-b usg-blu">mavi</tspan><tspan class="usg-s13"> = TivaWare</tspan></text>
<text class="usg-s13 usg-mut" x="16" y="50">Hangi bitin geçerli olduğunu mod ve RCC.ACG seçer.</text>
<rect class="usg-box" x="16" y="98" width="252" height="66" rx="8"/>
<text x="28" y="119" xml:space="preserve"><tspan class="usg-mono usg-b">RCGCGPIO</tspan><tspan class="usg-mono">.R5</tspan><tspan class="usg-s12 usg-mut">  ofset 0x608</tspan></text>
<text class="usg-s12" x="28" y="137">Run modu için GPIOF saat biti</text>
<text class="usg-m12 usg-blu" x="28" y="154">SysCtlPeripheralEnable</text>
<rect class="usg-box" x="16" y="184" width="252" height="66" rx="8"/>
<text x="28" y="205" xml:space="preserve"><tspan class="usg-mono usg-b">SCGCGPIO</tspan><tspan class="usg-mono">.S5</tspan><tspan class="usg-s12 usg-mut">  ofset 0x708</tspan></text>
<text class="usg-s12" x="28" y="223">Sleep modu için GPIOF saat biti</text>
<text class="usg-m12 usg-blu" x="28" y="240">SysCtlPeripheralSleepEnable</text>
<rect class="usg-box" x="16" y="270" width="252" height="66" rx="8"/>
<text x="28" y="291" xml:space="preserve"><tspan class="usg-mono usg-b">DCGCGPIO</tspan><tspan class="usg-mono">.D5</tspan><tspan class="usg-s12 usg-mut">  ofset 0x808</tspan></text>
<text class="usg-s12" x="28" y="309">Deep-Sleep modu için GPIOF saat biti</text>
<text class="usg-m12 usg-blu" x="28" y="326">SysCtlPeripheralDeepSleepEnable</text>
<rect class="usg-box" x="16" y="368" width="284" height="62" rx="8"/>
<text x="28" y="389"><tspan class="usg-mono usg-b">RCC.ACG</tspan><tspan class="usg-s12 usg-mut"> (bit 27, reset 0)</tspan></text>
<text class="usg-s12" x="28" y="407">otomatik saat geçitleme</text>
<text class="usg-m12 usg-blu" x="28" y="423">SysCtlPeripheralClockGating(true)</text>
