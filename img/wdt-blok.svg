<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 522" class="wbk-svg" role="img" aria-labelledby="wbk-title wbk-desc">
<title id="wbk-title">Watchdog modülü blok şeması (sadeleştirilmiş)</title>
<desc id="wbk-desc">Veri sayfası Şekil 12-1’e dayalı sade blok şeması. WDT0 ve WDT1 aynı yapıdadır; WDT0 sistem saatiyle, WDT1 PIOSC (16 MHz) ile sayar. WDT1 ayrı saat alanında olduğu için her register yazımından sonra WDTCTL.WRC = 1 beklenir. WDTLOAD yazılınca 32 bit aşağı sayaç hemen yüklenir; sayacın anlık değeri WDTVALUE’dan okunur. WDTCTL.INTEN = 1 sayacı başlatır ve bir bundan sonra yalnız reset ile silinir. Sıfır algılayıcı zaman aşımını bildirir. İlk zaman aşımında WDTRIS = 1 olur ve sayaç WDTLOAD’dan yeniden yüklenir; ikinci zaman aşımında RIS hâlâ 1 ise reset isteği oluşur. Kesme yolu: WDTRIS ve INTEN birlikte WDTMIS’i verir; INTTYPE = 0 ise NVIC’e INT 18 (iki modülde ortak), INTTYPE = 1 ise NMI gider. Reset yolu: reset isteği RESEN = 1 ise sistem reset’ine gider ve RESC’te WDT0 ya da WDT1 biti 1 olur. WDTICR’a herhangi bir değer yazmak kesmeyi temizler ve sayacı yeniden yükler (besleme); WDTLOAD yazmak kesmeyi temizlemez. WDTLOCK’a 0x1ACC.E551 yazmak kilidi açar, başka bir değer kilitler; WDTICR ve WDTTEST kilitten etkilenmez. WDTTEST.STALL = 1 iken hata ayıklayıcı CPU’yu durdurunca sayma durur.</desc>
<defs>
<marker id="wbk-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="wbk-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="wbk-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="wbk-heada" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="wbk-arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="wbk-headm" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
