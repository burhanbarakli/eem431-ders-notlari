<rect class="tbl-code" x="12" y="604" width="736" height="78" rx="8"/>
<text x="26" y="626" xml:space="preserve"><tspan class="tbl-b">TM4C123GH6PM’de 12 GPTM bloğu</tspan><tspan class="tbl-s13 tbl-mut">  (taban adresleri, her blok 4 KB)</tspan></text>
<text x="26" y="648" xml:space="preserve"><tspan class="tbl-s13 tbl-b">6 × 16/32-bit  </tspan><tspan class="tbl-s13">Timer0–5:  </tspan><tspan class="tbl-mono">0x4003.0000, 0x4003.1000 … 0x4003.5000</tspan><tspan class="tbl-s13 tbl-mut">   A/B 16, birleşik 32</tspan></text>
<text x="26" y="668" xml:space="preserve"><tspan class="tbl-s13 tbl-b">6 × 32/64-bit  </tspan><tspan class="tbl-s13">WTimer0–5: </tspan><tspan class="tbl-mono">0x4003.6000, 0x4003.7000, 0x4004.C000 … 0x4004.F000</tspan><tspan class="tbl-s13 tbl-mut">   A/B 32, birleşik 64</tspan></text>
