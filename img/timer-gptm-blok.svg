<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" class="tbl-svg" role="img" aria-labelledby="tbl-title tbl-desc">
<title id="tbl-title">GPTM blok şeması</title>
<desc id="tbl-desc">Bir 16/32-bit GPTM bloğu: sistem saati Timer A ve Timer B’ye gider; her birinde kip (GPTMTnMR), yükleme (GPTMTnILR), eşleşme (GPTMTnMATCHR), ön bölücü (GPTMTnPR), sayaç (GPTMTnR) ve karşılaştırıcı vardır. Ortada ortak denetim GPTMCFG ve GPTMCTL. Olaylar kesme mantığına (GPTMRIS, GPTMIMR, GPTMMIS, GPTMICR) ve oradan NVIC’e (IRQ 19 Timer0A, IRQ 20 Timer0B) gider; TnOTE ile ADC tetiklenebilir. CCP pinleri T0CCP0 ve T0CCP1. Altta adresler: Timer0–5 0x4003.0000–0x4003.5000, WTimer0–1 0x4003.6000–0x4003.7000, WTimer2–5 0x4004.C000–0x4004.F000. TI Şekil 11-1’in sade yeniden çizimi.</desc>
<defs>
<marker id="tbl-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="tbl-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="tbl-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="tbl-heada" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
