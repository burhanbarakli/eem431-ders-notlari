<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" class="nvo-svg" role="img" aria-labelledby="nvo-title nvo-desc">
<title id="nvo-title">PRIn register’ı ve PRIGROUP bölünmesi</title>
<desc id="nvo-desc">Üstte PRIn register’ının 32 biti: dört baytlık alan INTA (bit 7:5, IRQ 4n), INTB (15:13, IRQ 4n+1), INTC (23:21, IRQ 4n+2), INTD (31:29, IRQ 4n+3). Her baytta yalnız üst üç bit uygulanmıştır; bit 4:0 okunduğunda 0’dır. Örnek: PRI7 (0xE000.E41C) IRQ 28–31’i tutar; IRQ 30 (GPIO Port F) INTC alanındadır, öncelik 1 için bit 23:21 = 001, bayt 0x20. PRI4 (0xE000.E410) IRQ 16–19’u tutar; IRQ 19 (Timer0A) INTD alanındadır, öncelik 5 için bit 31:29 = 101, bayt 0xA0. Altta APINT.PRIGROUP’a göre üç bitin bölünmesi (veri sayfası Tablo 3-9): PRIGROUP 0–4: 8 grup (önalma) düzeyi, alt öncelik yok; 5: 4 grup × 2 alt; 6: 2 grup × 4 alt; 7: 1 grup × 8 alt, önalma yok.</desc>
