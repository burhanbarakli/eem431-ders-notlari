<text class="nvv-m12" x="330" y="214" text-anchor="end">4</text>
<text class="nvv-m12" x="86" y="213" text-anchor="end">0x010</text>
<rect class="nvv-cell" x="94" y="220" width="252" height="22" rx="0"/>
