<rect class="nvv-cella" x="94" y="488.8" width="252" height="22" rx="0"/>
<text class="nvv-s13 nvv-b nvv-acc" x="102" y="504.8">GPIO Port F · IRQ 30</text>
<text class="nvv-m12" x="330" y="504.8" text-anchor="end">46</text>
<text class="nvv-m12" x="86" y="503.8" text-anchor="end">0x0B8</text>
<rect class="nvv-cell" x="94" y="510.8" width="252" height="16" rx="0"/>
