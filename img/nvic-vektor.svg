<text class="nvv-m12" x="330" y="236" text-anchor="end">5</text>
<text class="nvv-m12" x="86" y="235" text-anchor="end">0x014</text>
<rect class="nvv-cell" x="94" y="242" width="252" height="22" rx="0"/>
<text class="nvv-s13" x="102" y="258">UsageFault</text>
<text class="nvv-m12" x="330" y="258" text-anchor="end">6</text>
<text class="nvv-m12" x="86" y="257" text-anchor="end">0x018</text>
<rect class="nvv-cellm" x="94" y="264" width="252" height="30.8" rx="0"/>
<text class="nvv-s12" x="102" y="284.4">ayrılmış (4 giriş, …0x028)</text>
<text class="nvv-m12" x="330" y="284.4" text-anchor="end">7–10</text>
<text class="nvv-m12" x="86" y="283.4" text-anchor="end">0x01C</text>
<rect class="nvv-cell" x="94" y="294.8" width="252" height="22" rx="0"/>
