<text class="nvv-s12" x="384" y="281">kopya: 155 kelime</text>
<rect class="nvv-code" x="452" y="468" width="292" height="124" rx="8"/>
<text class="nvv-m12 nvv-b" x="464" y="488">IntRegister(n, işleyici)</text>
<circle class="nvv-circ" cx="476" cy="508" r="9"/>
<text class="nvv-num" x="476" y="513" text-anchor="middle">1</text>
<text class="nvv-s12" x="492" y="513">VTABLE ≠ dizi ise 155 girişi kopyalar</text>
<circle class="nvv-circ" cx="476" cy="532" r="9"/>
<text class="nvv-num" x="476" y="537" text-anchor="middle">2</text>
<text class="nvv-s12" x="492" y="537">VTABLE ← g_pfnRAMVectors</text>
<circle class="nvv-circ" cx="476" cy="556" r="9"/>
<text class="nvv-num" x="476" y="561" text-anchor="middle">3</text>
<text class="nvv-s12" x="492" y="561">giriş n ← işleyici adresi</text>
<text class="nvv-s12 nvv-mut" x="464" y="582">GPIOIntRegister, TimerIntRegister … çağırır</text>
</svg>
