<text class="nvv-m12" x="330" y="170" text-anchor="end">2</text>
<text class="nvv-m12" x="86" y="169" text-anchor="end">0x008</text>
<rect class="nvv-cell" x="94" y="176" width="252" height="22" rx="0"/>
<text class="nvv-s13" x="102" y="192">HardFault</text>
<text class="nvv-m12" x="330" y="192" text-anchor="end">3</text>
<text class="nvv-m12" x="86" y="191" text-anchor="end">0x00C</text>
<rect class="nvv-cell" x="94" y="198" width="252" height="22" rx="0"/>
