<text class="nvv-m12" x="330" y="466.8" text-anchor="end">35</text>
<text class="nvv-m12" x="86" y="465.8" text-anchor="end">0x08C</text>
<rect class="nvv-cell" x="94" y="472.8" width="252" height="16" rx="0"/>
