<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" class="nvv-svg" role="img" aria-labelledby="nvv-title nvv-desc">
<title id="nvv-title">Vektör tablosunun bellekteki yerleşimi ve VTABLE</title>
<desc id="nvv-desc">Solda Flash’ın başındaki vektör tablosu (0x0000.0000), her giriş 4 bayt: ofset 0x000 ilk yığın işaretçisi değeri, 0x004 Reset (vektör 1), 0x008 NMI (2), 0x00C HardFault (3), 0x010 MemManage (4), 0x014 BusFault (5), 0x018 UsageFault (6), 0x01C–0x028 ayrılmış (7–10), 0x02C SVCall (11), 0x030 Debug Monitor (12), 0x034 ayrılmış (13), 0x038 PendSV (14), 0x03C SysTick (15); 0x040 GPIO Port A (IRQ 0, vektör 16), … 0x08C Timer0A (IRQ 19, vektör 35), … 0x0B8 GPIO Port F (IRQ 30, vektör 46), … son giriş 0x268 PWM1 Fault (IRQ 138, vektör 154). Tablo 155 giriş, 620 bayttır. Sağda VTABLE register’ı (0xE000.ED08): reset değeri 0x0000.0000, yani Flash tablosu kullanılır. IntRegister ilk çağrıldığında 155 girişi SRAM’deki 1 KB hizalı g_pfnRAMVectors dizisine kopyalar (TI örneklerinde 0x2000.0000), VTABLE’ı bu diziye çevirir ve ilgili girişe yeni işleyicinin adresini yazar. Formüller: adres = VTABLE + 4 × vektör, vektör = IRQ + 16.</desc>
<defs>
<marker id="nvv-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="nvv-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="nvv-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="nvv-heada" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="nvv-arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="nvv-headb" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
