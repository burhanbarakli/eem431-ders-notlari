<text class="nvv-s16 nvv-b" x="16" y="29">Vektör tablosu bellekte</text>
<text class="nvv-s13 nvv-mut" x="16" y="50">Her giriş 4 bayt: 0. giriş ilk SP, ötekiler işleyici adresi (bit 0 = 1, Thumb). Satırlar ölçekli değil.</text>
<text x="94" y="84"><tspan class="nvv-s13 nvv-b">Flash</tspan><tspan class="nvv-s12 nvv-mut"> · </tspan><tspan class="nvv-m12 nvv-mut">0x0000.0000</tspan></text>
<text class="nvv-s12 nvv-mut" x="86" y="104" text-anchor="end">ofset</text>
<text class="nvv-s12 nvv-mut" x="102" y="104">içerik</text>
<text class="nvv-s12 nvv-mut" x="330" y="104" text-anchor="end">vektör</text>
<rect class="nvv-cellf" x="94" y="110" width="252" height="22" rx="0"/>
<text class="nvv-s13" x="102" y="126">ilk SP değeri (yığın tepesi)</text>
<text class="nvv-m12" x="330" y="126" text-anchor="end">0</text>
<text class="nvv-m12" x="86" y="125" text-anchor="end">0x000</text>
<rect class="nvv-cell" x="94" y="132" width="252" height="22" rx="0"/>
