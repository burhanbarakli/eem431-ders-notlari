<rect class="nvv-cell" x="94" y="526.8" width="252" height="22" rx="0"/>
<text class="nvv-s13" x="102" y="542.8">PWM1 Fault · IRQ 138</text>
<text class="nvv-m12" x="330" y="542.8" text-anchor="end">154</text>
<text class="nvv-m12" x="86" y="541.8" text-anchor="end">0x268</text>
<text class="nvv-m12 nvv-mut" x="86" y="562.8" text-anchor="end">0x26C</text>
<text class="nvv-s12 nvv-mut" x="102" y="565.8">155 giriş × 4 = 620 bayt</text>
<path class="nvv-wm" d="M44,112 L38,112 L38,402.8 L44,402.8"/>
<text class="nvv-s12 nvv-b" x="30" y="257.4" text-anchor="middle" transform="rotate(-90 30 257.4)">0: ilk SP · 1–15 sistem istisnaları</text>
<path class="nvv-wm" d="M44,414.8 L38,414.8 L38,546.8 L44,546.8"/>
<text class="nvv-s12 nvv-b" x="30" y="480.8" text-anchor="middle" transform="rotate(-90 30 480.79999999999995)">kesmeler · IRQ 0–138</text>
<rect class="nvv-box" x="492" y="70" width="252" height="98" rx="8"/>
<text x="504" y="90" xml:space="preserve"><tspan class="nvv-mono nvv-b">VTABLE</tspan><tspan class="nvv-m12 nvv-mut">  0xE000.ED08</tspan></text>
<text class="nvv-s12 nvv-mut" x="504" y="107">bit 31:10 → tablo 1 KB sınırında olmalı</text>
<text x="504" y="131"><tspan class="nvv-s12">reset: </tspan><tspan class="nvv-m12 nvv-b nvv-blu">0x0000.0000</tspan><tspan class="nvv-s12"> → Flash</tspan></text>
<text x="504" y="153"><tspan class="nvv-s12">IntRegister sonrası: </tspan><tspan class="nvv-m12 nvv-b nvv-acc">&amp;g_pfnRAMVectors</tspan></text>
<path class="nvv-wb" d="M491,121.0 L347,121.0" marker-end="url(#nvv-arrb)"/>
<text x="500" y="232"><tspan class="nvv-s13 nvv-b">SRAM</tspan><tspan class="nvv-s12 nvv-mut"> · </tspan><tspan class="nvv-m12">g_pfnRAMVectors[155]</tspan></text>
<text class="nvv-s12 nvv-mut" x="500" y="250">1 KB hizalı; TI örneklerinde 0x2000.0000</text>
