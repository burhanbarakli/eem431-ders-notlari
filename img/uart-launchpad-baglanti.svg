.ulb-svg .ulb-hl{fill:var(--fig-accent,#b4481f);fill-opacity:.28;stroke:var(--fig-accent,#b4481f);stroke-width:1.8}
.ulb-svg .ulb-hlb{fill:var(--fig-blue,#1f5fa8);fill-opacity:.28;stroke:var(--fig-blue,#1f5fa8);stroke-width:1.5}
