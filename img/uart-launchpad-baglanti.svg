<text class="ulb-s13" x="493" y="176" text-anchor="middle">micro-B</text>
<rect class="ulb-box2" x="536" y="64" width="212" height="116" rx="6"/>
<text class="ulb-b" x="546" y="84">PC</text>
<text class="ulb-s13" x="546" y="102">Stellaris Virtual Serial</text>
<text class="ulb-s13" x="546" y="118">Port (COMx)</text>
<text class="ulb-s13" x="546" y="138">terminal (PuTTY) ya da</text>
<text x="546" y="154"><tspan class="ulb-s13">C# </tspan><tspan class="ulb-mono">SerialPort</tspan></text>
