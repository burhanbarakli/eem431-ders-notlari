<text class="ulb-mono ulb-b" x="192" y="343" text-anchor="end">GND</text>
<text class="ulb-s13 ulb-mut" x="34" y="295">J1.04</text>
<text class="ulb-s13 ulb-mut" x="34" y="323">J1.03</text>
