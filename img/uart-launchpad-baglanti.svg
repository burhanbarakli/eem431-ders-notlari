.ulb-svg .ulb-w{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.6}
.ulb-svg .ulb-wa{fill:none;stroke:var(--fig-accent,#b4481f);stroke-width:1.8}
.ulb-svg .ulb-wb{fill:none;stroke:var(--fig-blue,#1f5fa8);stroke-width:2}
.ulb-svg .ulb-zone{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1.2;stroke-dasharray:4 4}
.ulb-svg .ulb-wgnd{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:2}
.ulb-svg .ulb-warnbox{fill:var(--fig-accent,#b4481f);fill-opacity:.28;stroke:var(--fig-accent,#b4481f);stroke-width:1.5}
</style>
<text x="12" y="22"><tspan class="ulb-s16 ulb-b">1 · UART0 → sanal COM portu</tspan><tspan class="ulb-s13 ulb-mut"> (LaunchPad kılavuzu SPMU296 §2.3.1, Tablo 2-8)</tspan></text>
