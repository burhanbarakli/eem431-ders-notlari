<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" class="ulb-svg" role="img" aria-labelledby="ulb-title ulb-desc">
<title id="ulb-title">LaunchPad UART bağlantıları</title>
<desc id="ulb-desc">Üstte: TM4C123GH6PM’nin UART0 pinleri U0Rx = PA0 ve U0Tx = PA1 kart üstündeki ICDI hata ayıklama MCU’suna bağlıdır; ICDI, Debug USB bağlantısı üzerinden PC’de Stellaris Virtual Serial Port (COMx) olarak görünür ve terminal ya da C# SerialPort ile açılır. Ortada: UART1 (PB1 = U1Tx, J1.04; PB0 = U1Rx, J1.03) harici modüle çapraz bağlanır: TX → RX, RX ← TX, ortak GND. TM4C123 pinleri 3,3 V TTL’dir; PB0, PB1, PD4, PD5 5 V toleranslı değildir; RS-232 (±3…±15 V) doğrudan bağlanmaz; TX ve RX hatları MAX3232 gibi bir seviye dönüştürücüden geçer. ICDI hedefe yalnız JTAG ile hata ayıklama sağlar.</desc>
<defs>
<marker id="ulb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ulb-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ulb-arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ulb-headb" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ulb-ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ulb-heada" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
