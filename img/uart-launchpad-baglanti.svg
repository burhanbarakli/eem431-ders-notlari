<text x="12" y="220"><tspan class="ulb-s16 ulb-b">2 · UART1 → harici modül</tspan><tspan class="ulb-s13 ulb-mut"> (çapraz bağlantı, ortak toprak; SPMU296 Tablo 2-3)</tspan></text>
