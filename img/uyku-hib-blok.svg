<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 582" class="uhb-svg" role="img" aria-labelledby="uhb-title uhb-desc">
<title id="uhb-title">Hibernation modülü blok şeması (sadeleştirilmiş)</title>
<desc id="uhb-desc">Veri sayfası Şekil 7-1’e dayalı sade blok şeması. 32,768 kHz osilatör (XOSC0, XOSC1 pinleri; HIBCTL.CLK32EN ile açılır) ön bölücüden (HIBRTCT ile ince ayar) 1 Hz üretir; RTC sayacı HIBRTCC 32 bit saniye ve HIBRTCSS 15 bit alt saniye sayar (RTCEN ile başlar, HIBRTCLD ile yüklenir). Eşleşme karşılaştırıcısı HIBRTCC’yi HIBRTCM0 ile, alt saniyeyi RTCSSM ile karşılaştırır ve RTCALT0 üretir. HIBDATA 16 × 32 bit, VDD ya da VBAT varken korunan bellektir. Düşük pil karşılaştırıcısı VBAT’ı VBATSEL eşiğiyle karşılaştırır ve LOWBAT üretir. Güç sıralama mantığı HIBREQ ile Hibernate’e girer; PINWEN ile WAKE pini, RTCWEN ile eşleşme, BATWKEN ile düşük pil uyandırır; VABORT düşük pilde girişi iptal eder. Çıkışlar: HIB pini harici regülatörü kapatır; VDD3ON = 1 ise iç anahtarlar çekirdek beslemesini (VDDC) keser ve pinler tutulur. Kesme mantığı (HIBIM, HIBRIS, HIBMIS, HIBIC) WAKE (EXTW), eşleşme (RTCALT0), LOWBAT ve WC olaylarını tek bir kesme isteğiyle NVIC’e verir. Modül VDD ile VBAT’tan yüksek olanından beslenir. Yeşil: LaunchPad’e özgü bağlantılar. Y1 32,768 kHz kristal XOSC0/XOSC1’e bağlı; SW2 düğmesi WAKE pinine R8 (330 Ω) üzerinden, PF0’a R1 (0 Ω) üzerinden bağlı; kartta pil yok, VBAT VDD ile aynı +MCU_PWR hattına bağlı; HIB pini yalnız H1 test noktasına çıkar, regülatöre bağlı değil; bu yüzden kart VDD3ON yolunu kullanır.</desc>
<defs>
<marker id="uhb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="uhb-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="uhb-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="uhb-heada" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="uhb-arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="uhb-headg" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
