.uhb-svg .uhb-grn{fill:var(--fig-green,#2f7d4f)}
.uhb-svg .uhb-box{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5}
.uhb-svg .uhb-hl{fill:var(--fig-accent,#b4481f);fill-opacity:.14;stroke:var(--fig-accent,#b4481f);stroke-width:1.8}
.uhb-svg .uhb-boxg{fill:var(--fig-fill,#ffffff);stroke:var(--fig-green,#2f7d4f);stroke-width:1.6}
.uhb-svg .uhb-head{fill:var(--fig-stroke,#2b2b29)}
.uhb-svg .uhb-heada{fill:var(--fig-accent,#b4481f)}
.uhb-svg .uhb-headg{fill:var(--fig-green,#2f7d4f)}
.uhb-svg .uhb-w{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.6}
.uhb-svg .uhb-wa{fill:none;stroke:var(--fig-accent,#b4481f);stroke-width:1.8}
.uhb-svg .uhb-wgt{fill:none;stroke:var(--fig-green,#2f7d4f);stroke-width:1.6}
