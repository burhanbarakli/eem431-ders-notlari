<text class="uhb-s16 uhb-b" x="16" y="29">Hibernation modülü (sadeleştirilmiş)</text>
<text x="744" y="29" text-anchor="end"><tspan class="uhb-s13 uhb-b uhb-grn">yeşil</tspan><tspan class="uhb-s13"> = LaunchPad’e özgü bağlantı</tspan></text>
<text class="uhb-s13 uhb-mut" x="16" y="50">Veri sayfası Şekil 7-1’e dayalı; register ve bit adları özgün.</text>
<rect class="uhb-zone" x="132" y="66" width="476" height="500" rx="10"/>
<text x="144" y="554"><tspan class="uhb-s13 uhb-b">Hibernation modülü</tspan><tspan class="uhb-s13 uhb-mut"> · besleme: VDD ile VBAT’tan yüksek olanı</tspan></text>
<rect class="uhb-boxg" x="16" y="96" width="100" height="60" rx="8"/>
<text class="uhb-b uhb-grn" x="26" y="114">Y1</text>
<text class="uhb-s12" x="26" y="131">32,768 kHz</text>
<text class="uhb-s12" x="26" y="148">kristal</text>
<rect class="uhb-boxg" x="16" y="292" width="100" height="64" rx="8"/>
<text class="uhb-m12 uhb-b uhb-grn" x="26" y="312">+MCU_PWR</text>
<text class="uhb-s12" x="26" y="329">3,3 V; VDD ile</text>
<text class="uhb-s12" x="26" y="346">ortak, pil yok</text>
<rect class="uhb-boxg" x="16" y="372" width="100" height="76" rx="8"/>
<text class="uhb-b uhb-grn" x="26" y="389.5">SW2</text>
<text class="uhb-s12" x="26" y="406.5">düğme; PF0’a</text>
<text class="uhb-s12" x="26" y="423.5">R1 0 Ω ile</text>
<text class="uhb-s12" x="26" y="440.5">de bağlı</text>
<rect class="uhb-box" x="190" y="86" width="118" height="80" rx="8"/>
<text class="uhb-s13 uhb-b" x="200" y="105.5">32,768 kHz</text>
<text class="uhb-s13" x="200" y="122.5">osilatör</text>
<text class="uhb-m12 uhb-mut" x="200" y="139.5">HIBCTL.</text>
<text class="uhb-m12" x="200" y="156.5">CLK32EN</text>
<rect class="uhb-box" x="330" y="86" width="100" height="80" rx="8"/>
<text class="uhb-s13 uhb-b" x="340" y="105.5">ön bölücü</text>
<text class="uhb-s13" x="340" y="122.5">÷ 32 768</text>
<text class="uhb-s13" x="340" y="139.5">→ 1 Hz</text>
<text class="uhb-m12 uhb-mut" x="340" y="156.5">HIBRTCT</text>
<rect class="uhb-box" x="452" y="86" width="144" height="80" rx="8"/>
<text class="uhb-s13 uhb-b" x="462" y="105.5">RTC sayacı</text>
<text x="462" y="122.5"><tspan class="uhb-m12">HIBRTCC</tspan><tspan class="uhb-s12"> 32 bit s</tspan></text>
<text x="462" y="139.5"><tspan class="uhb-m12">HIBRTCSS</tspan><tspan class="uhb-s12"> 15 bit alt s</tspan></text>
<text class="uhb-m12 uhb-mut" x="462" y="156.5">RTCEN, HIBRTCLD</text>
<rect class="uhb-box" x="452" y="196" width="144" height="66" rx="8"/>
<text class="uhb-s13 uhb-b" x="462" y="217">eşleşme (=)</text>
<text class="uhb-m12" x="462" y="234">HIBRTCM0, RTCSSM</text>
<text class="uhb-m12 uhb-acc" x="462" y="251">→ RTCALT0</text>
<rect class="uhb-box" x="190" y="196" width="118" height="80" rx="8"/>
<text class="uhb-mono uhb-b" x="200" y="215.5">HIBDATA</text>
<text class="uhb-s12" x="200" y="232.5">16 × 32 bit</text>
<text class="uhb-s12" x="200" y="249.5">VDD ya da VBAT</text>
<text class="uhb-s12" x="200" y="266.5">varken korunur</text>
<rect class="uhb-box" x="190" y="292" width="118" height="64" rx="8"/>
<text class="uhb-s13 uhb-b" x="200" y="312">düşük pil</text>
<text x="200" y="329"><tspan class="uhb-s12">eşik: </tspan><tspan class="uhb-m12">VBATSEL</tspan></text>
<text class="uhb-m12 uhb-acc" x="200" y="346">→ LOWBAT</text>
<rect class="uhb-hl" x="330" y="300" width="266" height="116" rx="8"/>
<text class="uhb-s13 uhb-b" x="340" y="322">güç sıralama mantığı</text>
<text x="340" y="342"><tspan class="uhb-m12">HIBREQ</tspan><tspan class="uhb-s12"> = 1 → Hibernate’e gir</tspan></text>
<text x="340" y="360"><tspan class="uhb-m12">PINWEN</tspan><tspan class="uhb-s12"> </tspan><tspan class="uhb-s12 uhb-ovl">WAKE</tspan><tspan class="uhb-s12"> · </tspan><tspan class="uhb-m12">RTCWEN</tspan><tspan class="uhb-s12"> eşleşme</tspan></text>
<text x="340" y="378"><tspan class="uhb-m12">BATWKEN</tspan><tspan class="uhb-s12"> düşük pil · </tspan><tspan class="uhb-m12">VABORT</tspan><tspan class="uhb-s12"> iptal</tspan></text>
<text x="340" y="396"><tspan class="uhb-m12">VDD3ON</tspan><tspan class="uhb-s12"> = 1 → iç anahtarlar da devrede</tspan></text>
<rect class="uhb-box" x="330" y="440" width="266" height="96" rx="8"/>
<text class="uhb-s13 uhb-b" x="340" y="462">kesme mantığı</text>
<text class="uhb-m12" x="340" y="482">HIBIM · HIBRIS · HIBMIS · HIBIC</text>
<text x="340" y="501"><tspan class="uhb-s12">olaylar: </tspan><tspan class="uhb-s12 uhb-ovl">WAKE</tspan><tspan class="uhb-s12"> (</tspan><tspan class="uhb-m12">EXTW</tspan><tspan class="uhb-s12">), eşleşme (</tspan><tspan class="uhb-m12">RTCALT0</tspan><tspan class="uhb-s12">),</tspan></text>
<text x="340" y="518"><tspan class="uhb-m12">LOWBAT</tspan><tspan class="uhb-s12">, yazma bitti (</tspan><tspan class="uhb-m12">WC</tspan><tspan class="uhb-s12">)</tspan></text>
<rect class="uhb-box" x="626" y="270" width="118" height="96" rx="8"/>
<text x="636" y="292"><tspan class="uhb-s13 uhb-b uhb-ovl">HIB</tspan><tspan class="uhb-s13 uhb-b"> pini</tspan></text>
<text class="uhb-s12" x="636" y="310">harici regülatörü</text>
<text class="uhb-s12" x="636" y="326">kapatır</text>
<text class="uhb-s12 uhb-grn" x="636" y="344">LaunchPad: yalnız</text>
<text class="uhb-s12 uhb-grn" x="636" y="359">test noktası H1</text>
<rect class="uhb-hl" x="626" y="380" width="118" height="106" rx="8"/>
<text class="uhb-mono uhb-b" x="636" y="401">VDD3ON</text>
<text class="uhb-s12" x="636" y="419">iç anahtarlar</text>
<text class="uhb-s12" x="636" y="434">VDDC’yi keser;</text>
<text class="uhb-s12" x="636" y="449">pinler tutulur</text>
<text class="uhb-s12 uhb-grn" x="636" y="468">LaunchPad bu yolu</text>
<text class="uhb-s12 uhb-grn" x="636" y="482">kullanır</text>
<rect class="uhb-box" x="626" y="498" width="118" height="50" rx="8"/>
<text class="uhb-s13 uhb-b" x="636" y="519">NVIC</text>
<text class="uhb-s12" x="636" y="536">Hibernate kesmesi</text>
<path class="uhb-wgt" d="M116,126 L189,126" marker-end="url(#uhb-arrg)"/>
<text class="uhb-m12 uhb-grn" x="138" y="119">XOSC0/1</text>
<path class="uhb-wgt" d="M116,324 L189,324" marker-end="url(#uhb-arrg)"/>
<text class="uhb-m12 uhb-grn" x="140" y="317">VBAT</text>
<path class="uhb-wgt" d="M116,402 L329,402" marker-end="url(#uhb-arrg)"/>
<text class="uhb-m12 uhb-grn uhb-ovl" x="140" y="395">WAKE</text>
<text class="uhb-s12 uhb-grn" x="140" y="419">R8 330 Ω</text>
<path class="uhb-w" d="M308,126 L329,126" marker-end="url(#uhb-arr)"/>
<path class="uhb-w" d="M430,126 L451,126" marker-end="url(#uhb-arr)"/>
<path class="uhb-w" d="M524,166 L524,195" marker-end="url(#uhb-arr)"/>
<path class="uhb-wa" d="M524,262 L524,299" marker-end="url(#uhb-arra)"/>
<text class="uhb-m12 uhb-acc" x="532" y="286">MATCH</text>
<path class="uhb-wa" d="M308,324 L329,324" marker-end="url(#uhb-arra)"/>
<path class="uhb-w" d="M596,318 L625,318" marker-end="url(#uhb-arr)"/>
<path class="uhb-w" d="M596,400 L625,400" marker-end="url(#uhb-arr)"/>
<path class="uhb-w" d="M596,523 L625,523" marker-end="url(#uhb-arr)"/>
</svg>
