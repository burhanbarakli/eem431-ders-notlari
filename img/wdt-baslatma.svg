<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 684" class="wbs-svg" role="img" aria-labelledby="wbs-title wbs-desc">
<title id="wbs-title">Watchdog başlatma akışı</title>
<desc id="wbs-desc">Adım numaraları veri sayfası 12.3 sırasıdır. Ön adım (numarasız): RCGCWD’de R0 (WDT0) ya da R1 (WDT1) biti 1 yapılır ve PRWD’de aynı bit 1 olana dek beklenir (SysCtlPeripheralEnable, SysCtlPeripheralReady). Numarasız isteğe bağlı adım: WDTTEST.STALL = 1 ile hata ayıklayıcı CPU’yu durdurunca sayma durur; kilitten önce yazılır (WatchdogStallEnable). 1: WDTLOAD’a yükleme değeri yazılır; 16 MHz’de 16 000 000 − 1 ile zaman aşımı yaklaşık 1 s olur (WatchdogReloadSet). 2: yalnız WDT1 için WDTCTL.WRC = 1 beklenir; TivaWare bunu beklemez. 3: reset isteniyorsa WDTCTL.RESEN = 1 (WatchdogResetEnable). 4: yalnız WDT1 için WRC = 1 beklenir. Numarasız isteğe bağlı adım: NMI isteniyorsa WDTCTL.INTTYPE = 1 (WatchdogIntTypeSet); her durumda 5’ten önce yazılır (12.3, 5. adımın denetim register’ını kilitlediğini söyler). 5: WDTCTL.INTEN = 1 watchdog’u başlatır ve kesmeyi açar; INTEN bundan sonra yalnız reset ile silinir (WatchdogEnable). Veri sayfası 12.3 bu adımın denetim register’ını da kilitlediğini söyler; register açıklaması (s. 780–781) yalnız INTEN yazımlarının yok sayıldığını belirtir. Numarasız isteğe bağlı adımlar: normal kesme kullanılıyorsa NVIC EN0 bit 18 = 1 yapılır (IntEnable(INT_WATCHDOG) ya da WatchdogIntRegister), NMI’da gerekmez; en son WDTLOCK’a 0x1ACC.E551 dışında bir değer yazılınca WDTICR ve WDTTEST dışındaki register’lar kilitlenir (WatchdogLock). Sonra watchdog çalışır: ISR, canlı bayrağı kuruluysa WDTICR’a yazarak besler (WatchdogIntClear) ya da ana döngü WDTLOAD’a yazar (WatchdogReloadSet; Şekil 5). Ön adım ve 1–5 düz çerçeveli, numarasız isteğe bağlı adımlar kesikli çerçevelidir.</desc>
<defs>
<marker id="wbs-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="wbs-head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
.wbs-svg{font-family:"Source Sans 3",system-ui,sans-serif}
.wbs-svg text{fill:var(--fig-stroke,#2b2b29);font-size:14px}
.wbs-svg .wbs-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-variant-ligatures:none}
.wbs-svg .wbs-m12{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-variant-ligatures:none}
.wbs-svg .wbs-b{font-weight:700}
.wbs-svg .wbs-s12{font-size:12px}
.wbs-svg .wbs-s13{font-size:13px}
.wbs-svg .wbs-s16{font-size:16px}
.wbs-svg .wbs-mut{fill:var(--fig-muted,#76746c)}
.wbs-svg .wbs-blu{fill:var(--fig-blue,#1f5fa8)}
.wbs-svg .wbs-num{fill:var(--fig-fill,#ffffff);font-weight:700;font-size:14px}
.wbs-svg .wbs-box{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5}
.wbs-svg .wbs-opt{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5;stroke-dasharray:6 4}
.wbs-svg .wbs-hl{fill:var(--fig-accent,#b4481f);fill-opacity:.14;stroke:var(--fig-accent,#b4481f);stroke-width:1.8}
.wbs-svg .wbs-circ{fill:var(--fig-accent,#b4481f)}
.wbs-svg .wbs-head{fill:var(--fig-stroke,#2b2b29)}
.wbs-svg .wbs-w{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.6}
</style>
<text class="wbs-s16 wbs-b" x="16" y="29">Watchdog başlatma</text>
<text x="16" y="50"><tspan class="wbs-s13 wbs-mut">Numaralar veri sayfası 12.3 sırası. WDT1’de her register yazımından sonra </tspan><tspan class="wbs-m12 wbs-mut">WDTCTL.WRC = 1</tspan><tspan class="wbs-s13 wbs-mut"> beklenir.</tspan></text>
<text x="16" y="70" xml:space="preserve"><tspan class="wbs-s12 wbs-b">koyu yazı</tspan><tspan class="wbs-s12"> = register   </tspan><tspan class="wbs-s12 wbs-b wbs-blu">mavi</tspan><tspan class="wbs-s12"> = TivaWare   </tspan><tspan class="wbs-s12 wbs-b wbs-mut">kesikli çerçeve</tspan><tspan class="wbs-s12"> = isteğe bağlı   </tspan><tspan class="wbs-s12 wbs-b">numarasız</tspan><tspan class="wbs-s12"> = veri sayfası sırasında yok</tspan></text>
<rect class="wbs-box" x="16" y="84" width="728" height="44" rx="8"/>
<text x="32" y="101.5"><tspan class="wbs-mono wbs-b">RCGCWD</tspan><tspan>: </tspan><tspan class="wbs-mono wbs-b">R0</tspan><tspan> (WDT0) ya da </tspan><tspan class="wbs-mono wbs-b">R1</tspan><tspan> (WDT1) = 1</tspan></text>
<text x="32" y="120.5"><tspan class="wbs-m12">PRWD</tspan><tspan class="wbs-s13 wbs-mut">’de aynı bit 1 olana dek bekle</tspan></text>
<text class="wbs-m12 wbs-blu" x="732" y="102" text-anchor="end">SysCtlPeripheralEnable</text>
<text class="wbs-m12 wbs-blu" x="732" y="118" text-anchor="end">SysCtlPeripheralReady</text>
<path class="wbs-w" d="M206,128 L206,137" marker-end="url(#wbs-arr)"/>
<rect class="wbs-opt" x="16" y="138" width="728" height="44" rx="8"/>
<text x="32" y="155.5"><tspan class="wbs-mono wbs-b">WDTTEST.STALL = 1</tspan></text>
<text class="wbs-s13 wbs-mut" x="32" y="174.5">hata ayıklayıcı durdurunca sayma durur; kilitten önce</text>
<text class="wbs-m12 wbs-blu" x="732" y="164" text-anchor="end">WatchdogStallEnable</text>
<path class="wbs-w" d="M206,182 L206,191" marker-end="url(#wbs-arr)"/>
<rect class="wbs-box" x="16" y="192" width="728" height="44" rx="8"/>
<circle class="wbs-circ" cx="38" cy="214" r="12"/>
<text class="wbs-num" x="38" y="219" text-anchor="middle">1</text>
<text x="62" y="209.5"><tspan class="wbs-mono wbs-b">WDTLOAD</tspan><tspan> = yükleme değeri</tspan></text>
<text x="62" y="228.5"><tspan class="wbs-s13 wbs-mut">16 MHz’de </tspan><tspan class="wbs-m12 wbs-mut">16 000 000 − 1</tspan><tspan class="wbs-s13 wbs-mut"> → zaman aşımı ≈ 1 s</tspan></text>
<text class="wbs-m12 wbs-blu" x="732" y="218" text-anchor="end">WatchdogReloadSet</text>
<path class="wbs-w" d="M206,236 L206,245" marker-end="url(#wbs-arr)"/>
<rect class="wbs-box" x="16" y="246" width="728" height="34" rx="8"/>
<circle class="wbs-circ" cx="38" cy="263" r="12"/>
<text class="wbs-num" x="38" y="268" text-anchor="middle">2</text>
<text x="62" y="268" xml:space="preserve"><tspan>WDT1 ise: </tspan><tspan class="wbs-mono wbs-b">WDTCTL.WRC = 1</tspan><tspan> bekle</tspan><tspan class="wbs-s13 wbs-mut">  (WDT0’da atlanır)</tspan></text>
<text x="732" y="267" text-anchor="end"><tspan class="wbs-s12 wbs-mut">TivaWare beklemez</tspan></text>
<path class="wbs-w" d="M206,280 L206,289" marker-end="url(#wbs-arr)"/>
<rect class="wbs-box" x="16" y="290" width="728" height="44" rx="8"/>
<circle class="wbs-circ" cx="38" cy="312" r="12"/>
<text class="wbs-num" x="38" y="317" text-anchor="middle">3</text>
<text x="62" y="307.5"><tspan class="wbs-mono wbs-b">WDTCTL.RESEN = 1</tspan></text>
<text class="wbs-s13 wbs-mut" x="62" y="326.5">reset isteniyorsa: ikinci zaman aşımında sistem reset’i</text>
<text class="wbs-m12 wbs-blu" x="732" y="316" text-anchor="end">WatchdogResetEnable</text>
<path class="wbs-w" d="M206,334 L206,343" marker-end="url(#wbs-arr)"/>
<rect class="wbs-box" x="16" y="344" width="728" height="34" rx="8"/>
<circle class="wbs-circ" cx="38" cy="361" r="12"/>
<text class="wbs-num" x="38" y="366" text-anchor="middle">4</text>
<text x="62" y="366" xml:space="preserve"><tspan>WDT1 ise: </tspan><tspan class="wbs-mono wbs-b">WDTCTL.WRC = 1</tspan><tspan> bekle</tspan><tspan class="wbs-s13 wbs-mut">  (WDT0’da atlanır)</tspan></text>
<text x="732" y="365" text-anchor="end"><tspan class="wbs-s12 wbs-mut">TivaWare beklemez</tspan></text>
<path class="wbs-w" d="M206,378 L206,387" marker-end="url(#wbs-arr)"/>
<rect class="wbs-opt" x="16" y="388" width="728" height="44" rx="8"/>
<text x="32" y="405.5" xml:space="preserve"><tspan class="wbs-mono wbs-b">WDTCTL.INTTYPE = 1</tspan><tspan>  NMI istenirse</tspan></text>
<text class="wbs-s13 wbs-mut" x="32" y="424.5">her durumda 5’ten önce yaz (12.3; bkz. Bölüm 2)</text>
<text class="wbs-m12 wbs-blu" x="732" y="414" text-anchor="end">WatchdogIntTypeSet</text>
<path class="wbs-w" d="M206,432 L206,441" marker-end="url(#wbs-arr)"/>
<rect class="wbs-hl" x="16" y="442" width="728" height="64" rx="8"/>
<circle class="wbs-circ" cx="38" cy="474" r="12"/>
<text class="wbs-num" x="38" y="479" text-anchor="middle">5</text>
<text x="62" y="461.5"><tspan class="wbs-mono wbs-b">WDTCTL.INTEN = 1</tspan></text>
<text class="wbs-s13 wbs-mut" x="62" y="480.5">başlatır, kesmeyi açar; INTEN yalnız reset ile silinir</text>
<text class="wbs-s13 wbs-mut" x="62" y="496.5">12.3: denetim register’ını da kilitler (s. 780–781 yalnız INTEN’i anar)</text>
<text class="wbs-m12 wbs-blu" x="732" y="478" text-anchor="end">WatchdogEnable</text>
<path class="wbs-w" d="M206,506 L206,515" marker-end="url(#wbs-arr)"/>
<rect class="wbs-opt" x="16" y="516" width="728" height="44" rx="8"/>
<text x="32" y="533.5"><tspan class="wbs-mono wbs-b">NVIC EN0</tspan><tspan> bit 18 = 1</tspan></text>
<text class="wbs-s13 wbs-mut" x="32" y="552.5">yalnız normal kesmede (INTTYPE = 0)</text>
<text class="wbs-m12 wbs-blu" x="732" y="534" text-anchor="end">IntEnable(INT_WATCHDOG)</text>
<text x="732" y="550" text-anchor="end"><tspan class="wbs-m12 wbs-blu">ya da WatchdogIntRegister</tspan></text>
<path class="wbs-w" d="M206,560 L206,569" marker-end="url(#wbs-arr)"/>
<rect class="wbs-opt" x="16" y="570" width="728" height="44" rx="8"/>
<text x="32" y="587.5"><tspan class="wbs-mono wbs-b">WDTLOCK</tspan><tspan> ← </tspan><tspan class="wbs-mono wbs-b">0x1ACC.E551</tspan><tspan> dışında bir değer</tspan></text>
<text class="wbs-s13 wbs-mut" x="32" y="606.5">en son: register’lar kilitlenir; WDTICR ve WDTTEST hariç</text>
<text class="wbs-m12 wbs-blu" x="732" y="596" text-anchor="end">WatchdogLock</text>
<path class="wbs-w" d="M206,614 L206,623" marker-end="url(#wbs-arr)"/>
<rect class="wbs-box" x="16" y="624" width="728" height="44" rx="8"/>
<text x="32" y="641.5"><tspan>çalışma: ISR, canlı bayrağı kuruluysa </tspan><tspan class="wbs-mono wbs-b">WDTICR</tspan><tspan>’a yazar</tspan></text>
<text x="32" y="660.5"><tspan class="wbs-s13 wbs-mut">ya da ana döngü </tspan><tspan class="wbs-m12 wbs-mut">WDTLOAD</tspan><tspan class="wbs-s13 wbs-mut">’a yazar (Şekil 5)</tspan></text>
<text class="wbs-m12 wbs-blu" x="732" y="642" text-anchor="end">WatchdogIntClear</text>
<text x="732" y="658" text-anchor="end"><tspan class="wbs-m12 wbs-blu">ya da WatchdogReloadSet</tspan></text>
</svg>
