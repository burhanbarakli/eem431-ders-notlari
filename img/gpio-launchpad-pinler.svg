<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" class="lp-svg" role="img" aria-labelledby="lp-title lp-desc">
<title id="lp-title">EK-TM4C123GXL LaunchPad: GPIO portları ve kart üstü elemanlar</title>
<desc id="lp-desc">Kartın sadeleştirilmiş blok şeması: hata ayıklama/güç USB ve ICDI, güç seçici, sol kenarda cihaz USB (PD4/PD5), TM4C123GH6PM ve Port A–F pin grupları; sağ üstte RESET ve altında RGB LED (PF1 kırmızı, PF2 mavi, PF3 yeşil); altta SW1 (PF4) ve SW2 (PF0); J1–J4 başlıkları. Sağda portların APB taban adresleri.</desc>
<style>
.lp-svg{font-family:"Source Sans 3",system-ui,sans-serif}
.lp-svg text{fill:var(--fig-stroke,#2b2b29);font-size:14px}
.lp-svg .lp-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-ligatures:none}
.lp-svg .lp-b{font-weight:700}
.lp-svg .lp-s13{font-size:13px}
.lp-svg .lp-s16{font-size:16px}
.lp-svg .lp-mut{fill:var(--fig-muted,#76746c)}
.lp-svg .lp-acc{fill:var(--fig-accent,#b4481f)}
.lp-svg .lp-board{fill:var(--fig-fill-2,#efece4);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.8}
.lp-svg .lp-box{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5}
.lp-svg .lp-knob{fill:var(--fig-stroke,#2b2b29)}
.lp-svg .lp-hdr{fill:var(--fig-fill,#ffffff);stroke:var(--fig-muted,#76746c);stroke-width:1.2}
.lp-svg .lp-dot{fill:var(--fig-muted,#76746c)}
.lp-svg .lp-w{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5;stroke-linejoin:round}
.lp-svg .lp-wa{fill:none;stroke:var(--fig-accent,#b4481f);stroke-width:2.2;stroke-linejoin:round}
.lp-svg .lp-tagacc{fill:var(--fig-fill,#ffffff);stroke:var(--fig-accent,#b4481f);stroke-width:2.2}
.lp-svg .lp-rowhl{fill:var(--fig-accent,#b4481f);fill-opacity:.13;stroke:var(--fig-accent,#b4481f);stroke-width:1.6}
.lp-svg .lp-thead{fill:var(--fig-fill-2,#efece4)}
.lp-svg .lp-grid{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1}
</style>
