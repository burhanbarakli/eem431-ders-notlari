<text class="lp-s13 lp-b" x="395" y="481" text-anchor="middle">SW2</text>
<text class="lp-s13 lp-mut" x="235" y="498" text-anchor="middle">J1–J4: pinler portlara karışık dağılmış (kılavuz Tablo 2-3…2-6)</text>
<text class="lp-s16 lp-b" x="472" y="38">GPIO portları — APB taban adresleri</text>
<text class="lp-s13 lp-mut" x="472" y="64">datasheet §10.4, s. 658–659</text>
<rect class="lp-thead" x="470" y="82" width="272" height="26"/>
<text class="lp-s13 lp-b" x="496" y="100" text-anchor="middle">Port</text>
<text class="lp-s13 lp-b" x="530" y="100">Pinler</text>
<text class="lp-s13 lp-b" x="626" y="100">Taban adresi</text>
<text class="lp-b" x="496" y="128" text-anchor="middle">A</text><text x="530" y="128">PA0–PA7</text><text class="lp-mono" x="626" y="128">0x4000.4000</text>
<text class="lp-b" x="496" y="158" text-anchor="middle">B</text><text x="530" y="158">PB0–PB7</text><text class="lp-mono" x="626" y="158">0x4000.5000</text>
<text class="lp-b" x="496" y="188" text-anchor="middle">C</text><text x="530" y="188">PC0–PC7</text><text class="lp-mono" x="626" y="188">0x4000.6000</text>
<text class="lp-b" x="496" y="218" text-anchor="middle">D</text><text x="530" y="218">PD0–PD7</text><text class="lp-mono" x="626" y="218">0x4000.7000</text>
<text class="lp-b" x="496" y="248" text-anchor="middle">E</text><text x="530" y="248">PE0–PE5</text><text class="lp-mono" x="626" y="248">0x4002.4000</text>
<rect class="lp-rowhl" x="470" y="258" width="272" height="30"/>
<text class="lp-b lp-acc" x="496" y="278" text-anchor="middle">F</text>
<text class="lp-b lp-acc" x="530" y="278">PF0–PF4</text>
<text class="lp-mono lp-b lp-acc" x="626" y="278">0x4002.5000</text>
<line class="lp-grid" x1="470" y1="138" x2="742" y2="138"/>
<line class="lp-grid" x1="470" y1="168" x2="742" y2="168"/>
<line class="lp-grid" x1="470" y1="198" x2="742" y2="198"/>
<line class="lp-grid" x1="470" y1="228" x2="742" y2="228"/>
<rect class="lp-grid" x="470" y="82" width="272" height="206"/>
<text class="lp-s13" x="472" y="318">• Toplam 43 GPIO pini (A–D: 8, E: 6, F: 5)</text>
<text class="lp-s13" x="472" y="344">• <tspan class="lp-mono">PF0</tspan>, <tspan class="lp-mono">PD7</tspan> ve <tspan class="lp-mono">PC0–PC3</tspan> <tspan class="lp-mono">GPIOCR</tspan> ile</text>
<text class="lp-s13" x="484" y="362">korunur (kilitli); önce <tspan class="lp-mono">GPIOLOCK</tspan> açılır</text>
<text class="lp-s13" x="472" y="388">• <tspan class="lp-mono">PC0–PC3</tspan> JTAG (ICDI) için ayrılmış;</text>
<text class="lp-s13" x="484" y="406">GPIO olarak değiştirmeyin</text>
<text class="lp-s13" x="472" y="432">• <tspan class="lp-mono">PA0/PA1</tspan> UART0 → sanal COM port</text>
<text class="lp-s13" x="472" y="458">• Butonlar basılınca pini GND'ye çeker</text>
<text class="lp-s13" x="484" y="476">(aktif düşük, iç pull-up gerekir)</text>
<text class="lp-s13 lp-mut" x="472" y="502">Blok şema; kart üstü yerleşim yaklaşık.</text>
</svg>
