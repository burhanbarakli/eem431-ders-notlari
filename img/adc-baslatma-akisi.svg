<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 813" class="aba-svg" role="img" aria-labelledby="aba-title aba-desc">
<title id="aba-title">ADC0 SS3 başlatma adımları</title>
<desc id="aba-desc">On üç adım, solda doğrudan register, sağda TivaWare (datasheet §13.4.1 ve §13.4.2 sırası): 1 ADC saati RCGCADC (0x400F.E638) ve hazır bekleme PRADC (0x400F.EA38), 2 GPIO Port E saati, 3 PE3 için AFSEL = 1, DEN = 0, AMSEL = 1 (GPIOPinTypeADC ise DIR = 0, AFSEL = 0, PUR = PDR = 0, DEN = 0, AMSEL = 1 yapar), 4 isteğe bağlı ADCSSPRI, ADCPC, ADCSAC, ADCCC, 5 ADCACTSS.ASEN3 = 0 (ADCSequenceDisable), 6 ADCEMUX tetik (ADCSequenceConfigure), 7 ADCSSMUX3 kanal ve 8 ADCSSCTL3 adım kontrolü (tek ADCSequenceStepConfigure çağrısı), 9 ADCISC temizleme ve ADCIM.MASK3 (ADCIntEnable; maske yalnız kesmeli kullanımda), 10 ASEN3 = 1 (ADCSequenceEnable), 11 NVIC EN0 bit 17 (IntEnable(INT_ADC0SS3)), 12 CPSIE I (IntMasterEnable), 13 tetikle ve yoklamada bekle, oku, temizle. İsteğe bağlı ve yalnız kesmeli adımlar kesik çizgili.</desc>
<defs>
<marker id="aba-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="aba-head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
.aba-svg{font-family:"Source Sans 3",system-ui,sans-serif}
.aba-svg text{fill:var(--fig-stroke,#2b2b29);font-size:14px}
.aba-svg .aba-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-variant-ligatures:none}
.aba-svg .aba-b{font-weight:700}
.aba-svg .aba-s13{font-size:13px}
.aba-svg .aba-s15{font-size:15px}
.aba-svg .aba-mut{fill:var(--fig-muted,#76746c)}
.aba-svg .aba-acc{fill:var(--fig-accent,#b4481f)}
.aba-svg .aba-blu{fill:var(--fig-blue,#1f5fa8)}
.aba-svg .aba-num{fill:var(--fig-fill,#ffffff);font-weight:700;font-size:14px}
.aba-svg .aba-box{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5}
.aba-svg .aba-opt{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5;stroke-dasharray:6 4}
