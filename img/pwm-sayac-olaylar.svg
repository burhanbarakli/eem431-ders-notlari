.pwms-svg .pwms-s12{font-size:12px}
.pwms-svg .pwms-s13{font-size:13px}
.pwms-svg .pwms-s16{font-size:16px}
.pwms-svg .pwms-mut{fill:var(--fig-muted,#76746c)}
.pwms-svg .pwms-acc{fill:var(--fig-accent,#b4481f)}
.pwms-svg .pwms-dot{fill:var(--fig-stroke,#2b2b29)}
.pwms-svg .pwms-dota{fill:var(--fig-accent,#b4481f)}
.pwms-svg .pwms-wm{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1.4}
.pwms-svg .pwms-grid{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:.8;stroke-dasharray:2 4}
.pwms-svg .pwms-wva{fill:none;stroke:var(--fig-accent,#b4481f);stroke-width:2.2;stroke-linejoin:round}
.pwms-svg .pwms-wvs{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:2.2;stroke-linejoin:round}
</style>
