<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 546" class="pwms-svg" role="img" aria-labelledby="pwms-title pwms-desc">
<title id="pwms-title">Aşağı sayma kipinde sayaç, olaylar, pwmA ve pwmB</title>
<desc id="pwms-desc">MODE = 0 (aşağı sayma; çalışırken PWM0CTL = 0x1), PWM saati 16 MHz ÷ 2 = 8 MHz, 1 tık = 125 ns. Sayaç LOAD = 319’dan 0’a iner, sonra yeniden 319’a yüklenir; periyot LOAD + 1 = 320 tık = 40 µs, yani 25 kHz. Her periyotta dört olay vardır: LOAD (sayaç 319), CMPA aşağı (sayaç 239, periyot başından 80 tık sonra), CMPB aşağı (sayaç 79, 240 tık sonra) ve sıfır (319 tık sonra; hemen ardından LOAD gelir). GENA = 0x8C: LOAD’da pwmA yüksek, CMPA aşağıda düşük; pwmA 319 − 239 = 80 tık = 10 µs yüksek kalır, görev oranı %25 (PB6, M0PWM0). GENB = 0x80C: LOAD’da pwmB yüksek, CMPB aşağıda düşük; pwmB 319 − 79 = 240 tık = 30 µs yüksek, %75 (PB7, M0PWM1).</desc>
