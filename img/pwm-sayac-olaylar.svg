.pwms-svg text{fill:var(--fig-stroke,#2b2b29);font-size:14px}
.pwms-svg .pwms-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-variant-ligatures:none}
.pwms-svg .pwms-m12{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-variant-ligatures:none}
