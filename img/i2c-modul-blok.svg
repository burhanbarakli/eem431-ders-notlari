<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" class="imb-svg" role="img" aria-labelledby="imb-title imb-desc">
<title id="imb-title">I2C0 pin yolu ve modül blok şeması (sadeleştirilmiş)</title>
<desc id="imb-desc">Veri sayfası Şekil 16-1’e dayalı sade şema. PB2 (I2C0SCL) ve PB3 (I2C0SDA) pinleri önce GPIO port B ayarlarından geçer: DEN ve AFSEL’de bit 2 ve 3 = 1 (0x0C), ODR’de yalnız bit 3 = 1 (SDA, 0x08), PCTL’de PMC2 = PMC3 = 3 (0x0000.3300). SCL pininde ODR açılmaz; modülün iç devresi onu açık-drenaj gibi sürer. I2C0 modülünde (taban 0x4002.0000) hatlar isteğe bağlı glitch filtresinden (I2CMCR.GFE = 1 ise; veri sayfası 16.3.1.9, Şekil 16-1’de ayrı blok olarak yok) ve I/O seçiminden geçer. I/O seçimi hatları master ve köle birimlerine verir; I2CMCR.LPBK = 1 iken master ve köle içten birbirine bağlanır (geri döngü testi). Master birimi I2CMSA (köle adresi ve R/S yön biti), I2CMDR (veri baytı), I2CMCS (yazınca komut, okuyunca durum) ve I2CMTPR (SCL üreteci) register’larını içerir ve I2CMCR.MFE = 1 ile açılır. Köle birimi (I2CSOAR kendi adresi, I2CSDR, I2CSCSR) I2CMCR.SFE = 1 ile açılır; bölüm 8’deki loopback örneğinde kullanılır. 7.1’de I2CMCR’a 0x10 yazmak yalnız MFE’yi açar; bölüm 8’de LPBK, MFE ve SFE birlikte yazılır. Master ve köle kesmeleri birleşip tek kesme olarak NVIC’e gider: I2C0 için INT 8, vektör 24. Master kesme register’ları I2CMIMR, I2CMRIS, I2CMMIS, I2CMICR.</desc>
<defs>
<marker id="imb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="imb-head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
