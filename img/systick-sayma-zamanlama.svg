<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" class="stz-svg" role="img" aria-labelledby="stz-title stz-desc">
<title id="stz-title">SysTick sayma zamanlaması, RELOAD = 4 örneği</title>
<desc id="stz-desc">Küçük örnek: RELOAD = 4. Sayıcı başlangıçta 0’dır (STCURRENT’e yazılmış); ENABLE = 1 yapıldıktan sonraki ilk saatte 4 yüklenir. Her saat kenarında 1 azalır: 4, 3, 2, 1, 0; 0’dan sonraki saatte yeniden 4 yüklenir (sarma). Sayıcı 1’den 0’a indiği anda COUNT 1 olur ve INTEN = 1 ise istisna 15 isteği oluşur; bu 5., 10. ve 18. saat kenarlarındadır. İki sıfır arası RELOAD + 1 = 5 saattir. 7. ile 8. kenar arasında STCTRL okunur ve COUNT 0 olur. 13. ile 14. kenar arasında STCURRENT’e yazılır: değer hemen 0 olur, COUNT 0 olur, istisna oluşmaz; sonraki saatte 4 yüklenir ve sayma sürer. Genel formül: periyot = (RELOAD + 1) / f. Örnek: 16 MHz, RELOAD = 3 999 999 için 4 000 000 / 16 MHz = 0,25 s.</desc>
<defs>
<marker id="stz-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="stz-head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
