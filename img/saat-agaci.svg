<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" class="sa-svg" role="img" aria-labelledby="sa-title sa-desc">
<title id="sa-title">Saat ağacı: sistem saati (SysClk) yolu</title>
<desc id="sa-desc">TM4C123GH6PM ana saat ağacının sistem saati kısmı (veri sayfası Şekil 5-5, sadeleştirilmiş). Kaynaklar: MOSC (LaunchPad’de Y2 16 MHz kristal, MOSCDIS ile açılır), PIOSC 16 MHz, PIOSC/4 = 4 MHz, LFIOSC yaklaşık 30 kHz, Hibernate osilatörü 32,768 kHz (Y1). İki seçici aynı OSCSRC/OSCSRC2 alanıyla sürülür: PLL giriş seçicisi yalnız MOSC (0) ya da PIOSC (1) alır; osilatör seçicisi 0 MOSC, 1 PIOSC, 2 PIOSC/4, 3 LFIOSC, 7 32,768 kHz (yalnız OSCSRC2) değerlerinden birini seçer. PLL 400 MHz üretir; XTAL alanı giriş frekansını bildirir, PWRDN/PWRDN2 = 0 PLL’e güç verir. DIV400 = 0 ise PLL çıkışı 2’ye bölünür (200 MHz), DIV400 = 1 ise 400 MHz doğrudan geçer. BYPASS/BYPASS2 seçicisi 0’da PLL yolunu, 1’de osilatör yolunu seçer. Ardından ÷ SYSDIV bölücüsü (SYSDIV, SYSDIV2 ya da DIV400 = 1 iken SYSDIV2:LSB) ve bölücülü/bölücüsüz seçici gelir; bu seçiciyi BYPASS ile USESYSDIV birlikte denetler: USESYSDIV = 1 ise bölücü kullanılır, BYPASS = 0 iken bölücü her zaman devrededir. Lejant: üst satır RCC alanı, mavi satır RCC2 alanı (USERCC2 = 1 iken geçerli). Çıkış SysClk, en çok 80 MHz.</desc>
