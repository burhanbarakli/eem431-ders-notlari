<text class="wza-m12" x="16" y="357">g_canli</text>
<text class="wza-s13" x="16" y="321">ana döngü</text>
<text class="wza-m12" x="16" y="414">WDTVALUE</text>
<text class="wza-m12" x="16" y="467">WDTRIS</text>
<text class="wza-s13" x="16" y="503">reset</text>
<text class="wza-m12 wza-mut" x="144" y="388" text-anchor="end">15 999 999</text>
<text class="wza-m12 wza-mut" x="144" y="440" text-anchor="end">0</text>
