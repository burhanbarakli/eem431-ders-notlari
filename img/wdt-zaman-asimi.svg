<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 648" class="wza-svg" role="img" aria-labelledby="wza-title wza-desc">
<title id="wza-title">Watchdog zaman çizelgesi: sağlıklı ve takılmış program</title>
<desc id="wza-desc">Örnek: 16 MHz sistem saati (PLL yok), WDTLOAD = 16 000 000 − 1 = 15 999 999, her zaman aşımı yaklaşık 1 s. t = 0’da INTEN = 1 ile sayma başlar. (a) Sağlıklı: ana döngü çalışır; sayaç (WDTVALUE) 15 999 999’dan 0’a iner, her zaman aşımında WDTRIS = 1 olur, kesme ISR’yi çalıştırır, ISR WDTICR’a yazar; RIS 0 olur ve sayaç yeniden yüklenir. Reset olmaz. (b) Ana döngü örnekte yaklaşık 2,4 s’de takılır. 1, 2 ve 3 s’deki kesmelerde ISR besler; ayrı bir satır g_canli bayrağını gösterir: ana döngü bayrağı kurar, ISR besleyince siler; 2 s’de silinen bayrağı ana döngü takılmadan önce yeniden kurmuştur, 3 s’deki son beslemeden sonra 0 kalır. 4 s’deki zaman aşımında bayrak 0 olduğu için ISR beslemez ve temizlemeden döner; WDTRIS 1 kalır, sayaç donanımca yeniden yüklenir. 5 s’de ikinci zaman aşımında RIS hâlâ 1 olduğu için (RESEN = 1) reset olur, RESC.WDT0 = 1 olur ve program baştan çalışır. Son beslemeden reset’e yaklaşık 2 s, takılmadan reset’e yaklaşık 2,6 s geçer. Zaman ölçeği yaklaşık; darbe genişlikleri abartılı.</desc>
<defs>
<marker id="wza-arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="wza-headm" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
