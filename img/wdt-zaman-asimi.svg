</style>
<text class="wza-s16 wza-b" x="16" y="29">İki zaman aşımı: sağlıklı ve takılmış program</text>
<text x="16" y="50"><tspan class="wza-s13 wza-mut">16 MHz sistem saati (PLL yok), </tspan><tspan class="wza-m12 wza-mut">WDTLOAD = 16 000 000 − 1</tspan><tspan class="wza-s13 wza-mut"> → zaman aşımı ≈ 1 s; t = 0’da </tspan><tspan class="wza-m12 wza-mut">INTEN = 1</tspan></text>
<text x="16" y="84"><tspan class="wza-s13 wza-b">(a) sağlıklı:</tspan><tspan class="wza-s13"> ana döngü çalışır, ISR her zaman aşımında besler</tspan></text>
<text class="wza-s13" x="16" y="111">ana döngü</text>
<text class="wza-m12" x="16" y="174">WDTVALUE</text>
<text class="wza-m12" x="16" y="227">WDTRIS</text>
