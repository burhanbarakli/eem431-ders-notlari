<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 658" class="ivy-svg" role="img" aria-labelledby="ivy-title ivy-desc">
<title id="ivy-title">I2C veri yolu: LaunchPad master, iki köle, çekme dirençleri</title>
<desc id="ivy-desc">EK-TM4C123GXL LaunchPad üzerindeki TM4C123GH6PM, I2C0 modülüyle master’dır: PB2 = I2C0SCL, PB3 = I2C0SDA. SCL ve SDA hatları iki köleye paralel bağlanır: adresi 0x55 olan bir köle (örneğin ikinci bir kart) ve kendi adresi olan bir sensör. Her hatta bir harici çekme direnci (örnek 4,7 kΩ) hattı 3,3 V’a bağlar; LaunchPad’de PB2 ve PB3 için kart üstü çekme direnci yoktur. Bütün aygıtların toprağı ortaktır. Boşta iki hat da yüksektir. Alt kutu genel I2C açık-drenaj modelini anlatır: aygıt 0 gönderirken çıkış transistörü (anahtar) iletimdedir ve hattı toprağa çeker; 1 gönderirken anahtar açıktır, hattı yalnız direnç 3,3 V’a çeker (veri sayfası Tablo 16-1’e göre TM4C’nin SCL sinyalinde ayrıca etkin bir çekme vardır). Hattaki aygıtlardan biri 0’a çekerse hat 0 olur; ACK ve hakemlik buna dayanır.</desc>
