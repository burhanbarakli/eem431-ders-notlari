<text class="ivy-s16 ivy-b" x="16" y="29">I2C veri yolu: iki hat, ortak toprak, çekme dirençleri</text>
<text class="ivy-s13 ivy-mut" x="16" y="50">Boşta iki hat da 1 (3,3 V). Aygıtlar hattı yalnız 0’a çeker; 1’i harici direnç verir.</text>
