<text x="28" y="139"><tspan class="ugm-m12">RCGCx</tspan><tspan class="ugm-s13"> çevre saati</tspan></text>
<text class="ugm-s13" x="28" y="158">PLL dahil her saat</text>
<rect class="ugm-box" x="204" y="114" width="164" height="122" rx="8"/>
