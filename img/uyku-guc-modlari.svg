<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" class="ugm-svg" role="img" aria-labelledby="ugm-title ugm-desc">
<title id="ugm-title">Güç modları merdiveni: Run, Sleep, Deep-Sleep, Hibernate</title>
<desc id="ugm-desc">Dört mod soldan sağa bir merdiven gibi iner. Run: çekirdek saatli ve kod çalışır, çevre birimleri RCGCx bitleriyle saatlenir, sistem saati PLL dahil her kaynaktan olabilir. Sleep: WFI ile girilir (SLEEPDEEP = 0, TivaWare SysCtlSleep); çekirdek ve bellek saati durur, çevre birimleri RCC.ACG = 1 ise SCGCx, ACG = 0 ise RCGCx bitleriyle saatlenir, sistem saati Run ile aynı kaynak ve frekanstır. Deep-Sleep: SLEEPDEEP = 1 ve WFI ile girilir (SysCtlDeepSleep); çevre birimleri ACG = 1 ise DCGCx, ACG = 0 ise RCGCx ile saatlenir, sistem saati DSLPCLKCFG ile seçilir, PLL çalışıyorsa kapanır. Sleep ve Deep-Sleep’te SRAM ve register içeriği korunur; kesme gelince işleyici çalışır ve program WFI’dan sonraki komuttan sürer. Hibernate: HIBCTL.HIBREQ = 1 ile girilir (HibernateRequest); yalnız Hibernation modülü çalışır, 32,768 kHz osilatörü RTC’yi sayar; SRAM silinir, 16 sözcüklük HIBDATA ve RTC kalır, VDD3ON modunda pin durumları tutulur. WAKE pini ya da RTC eşleşmesi gücü geri getirir, normal güç açma reset’i olur ve main baştan çalışır. Altta Workbook Lab 6 ölçümleri log ölçekte: Run 40 MHz 21,9 mA, Hibernate VDD3ON RTC’siz 6,7 µA, RTC’li 6,9 µA; Sleep ve Deep-Sleep Lab 6’da ölçülmedi.</desc>
