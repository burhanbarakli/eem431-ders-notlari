<text class="ugm-s13" x="404" y="208">çekirdek durur</text>
<text class="ugm-s13" x="404" y="227">PLL çalışıyorsa</text>
<text class="ugm-s13" x="404" y="246">kapanır</text>
<text class="ugm-s13" x="404" y="265">bellek korunur</text>
<rect class="ugm-hl" x="580" y="202" width="164" height="122" rx="8"/>
<text class="ugm-s16 ugm-b" x="592" y="228">Hibernate</text>
<text class="ugm-s13" x="592" y="252">yalnız Hibernation</text>
<text class="ugm-s13" x="592" y="271">modülü; RTC sayar</text>
<text class="ugm-s13" x="592" y="290">SRAM silinir,</text>
<text x="592" y="309"><tspan class="ugm-m12">HIBDATA</tspan><tspan class="ugm-s13"> kalır</tspan></text>
<path class="ugm-w" d="M180,92 L350,92 L350,113" marker-end="url(#ugm-arr)"/>
<text x="188" y="85"><tspan class="ugm-m12">SLEEPDEEP = 0 + </tspan><tspan class="ugm-m12 ugm-b">WFI</tspan></text>
<text class="ugm-m12 ugm-blu" x="188" y="105">SysCtlSleep()</text>
<path class="ugm-w" d="M368,136 L538,136 L538,157" marker-end="url(#ugm-arr)"/>
<text x="376" y="129"><tspan class="ugm-m12">SLEEPDEEP = 1 + </tspan><tspan class="ugm-m12 ugm-b">WFI</tspan></text>
<text class="ugm-m12 ugm-blu" x="376" y="149">SysCtlDeepSleep()</text>
<path class="ugm-w" d="M556,180 L726,180 L726,201" marker-end="url(#ugm-arr)"/>
<text x="564" y="173"><tspan class="ugm-m12 ugm-b">HIBCTL.HIBREQ = 1</tspan></text>
<text class="ugm-m12 ugm-blu" x="564" y="193">HibernateRequest()</text>
