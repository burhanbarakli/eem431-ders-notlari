<text x="16" y="438" xml:space="preserve"><tspan class="ugm-s13 ugm-b">VDD akımı</tspan><tspan class="ugm-s13 ugm-mut">  · Workbook Lab 6 ölçümü, LaunchPad, log ölçek</tspan></text>
