<text x="368" y="92"><tspan class="tvt-b">Kendi ISR’nizi bağlamak: </tspan><tspan class="tvt-b tvt-acc">iki değişiklik</tspan></text>
<text x="368" y="111"><tspan class="tvt-s13 tvt-mut">dosya: </tspan><tspan class="tvt-mono tvt-mut">startup_ccs.c</tspan><tspan class="tvt-s13 tvt-mut"> (CCS: </tspan><tspan class="tvt-mono tvt-mut">tm4c123gh6pm_startup_ccs.c</tspan><tspan class="tvt-s13 tvt-mut">)</tspan></text>
<rect class="tvt-code" x="368" y="122" width="384" height="400" rx="8"/>
<text class="tvt-mono tvt-mut" x="378" y="148">// startup_ccs.c</text>
<rect class="tvt-hl" x="372" y="170" width="376" height="20" rx="4"/>
<circle class="tvt-circ" cx="734" cy="180" r="10"/>
<text class="tvt-num" x="734" y="185" text-anchor="middle">1</text>
<text class="tvt-mono tvt-b tvt-acc" x="378" y="184">extern void Timer0IntHandler(void);</text>
<text class="tvt-mono" x="378" y="220">#pragma DATA_SECTION(g_pfnVectors, ".intvecs")</text>
<text class="tvt-mono" x="378" y="238">void (* const g_pfnVectors[])(void) =</text>
<text class="tvt-mono" x="378" y="256">{</text>
<text class="tvt-mono" x="378" y="274" xml:space="preserve">  (void (*)(void))((uint32_t)&amp;__STACK_TOP),</text>
<text class="tvt-mono" x="378" y="292" xml:space="preserve">  ResetISR,          // The reset handler</text>
<text class="tvt-mono" x="378" y="310" xml:space="preserve">  NmiSR,             // The NMI handler</text>
<text class="tvt-mono" x="378" y="328" xml:space="preserve">  FaultISR,          // The hard fault handler</text>
<text class="tvt-mono tvt-mut" x="378" y="346" xml:space="preserve">  …</text>
<text class="tvt-mono" x="378" y="364" xml:space="preserve">  IntDefaultHandler, // The SysTick handler</text>
<text class="tvt-mono" x="378" y="382" xml:space="preserve">  IntDefaultHandler, // GPIO Port A</text>
<text class="tvt-mono tvt-mut" x="378" y="400" xml:space="preserve">  …</text>
<text class="tvt-mono" x="378" y="418" xml:space="preserve">  IntDefaultHandler, // Watchdog timer</text>
<text class="tvt-mono tvt-mut tvt-strike" x="378" y="436" xml:space="preserve">  IntDefaultHandler, // Timer 0 subtimer A</text>
<rect class="tvt-hl" x="372" y="440" width="376" height="20" rx="4"/>
<circle class="tvt-circ" cx="734" cy="450" r="10"/>
<text class="tvt-num" x="734" y="455" text-anchor="middle">2</text>
<text class="tvt-mono tvt-b tvt-acc" x="378" y="454" xml:space="preserve">  Timer0IntHandler,  // Timer 0 subtimer A</text>
<text class="tvt-mono" x="378" y="472" xml:space="preserve">  IntDefaultHandler, // Timer 0 subtimer B</text>
<text class="tvt-mono tvt-mut" x="378" y="490" xml:space="preserve">  …</text>
<text class="tvt-mono" x="378" y="508">};</text>
<path class="tvt-wa" d="M372,449 L352,449" marker-end="url(#tvt-arra)"/>
<rect class="tvt-box" x="12" y="566" width="740" height="100" rx="8"/>
<text x="26" y="589" xml:space="preserve"><tspan class="tvt-b">Her giriş 4 bayt: </tspan><tspan class="tvt-s13">ofset = 4 × vektör no</tspan><tspan class="tvt-mut">  ·  </tspan><tspan class="tvt-s13">vektör no = IRQ + 16</tspan><tspan class="tvt-s13">  →  Timer0A: 4 × 35 = 140 = </tspan><tspan class="tvt-mono tvt-b">0x08C</tspan></text>
<text x="26" y="610"><tspan class="tvt-b">Sıra önemli: </tspan><tspan class="tvt-s13">bir satır kayarsa kesme yanlış ISR’ye gider. </tspan><tspan class="tvt-mono">INT_TIMER0A</tspan><tspan class="tvt-s13"> = 35 (vektör no), </tspan><tspan class="tvt-mono">EN0</tspan><tspan class="tvt-s13"> biti = 19 (IRQ no).</tspan></text>
<text x="26" y="631"><tspan class="tvt-b">Alternatif: </tspan><tspan class="tvt-mono">TimerIntRegister(TIMER0_BASE, TIMER_A, Timer0IntHandler)</tspan><tspan class="tvt-s13"> tabloyu SRAM’e kopyalar,</tspan></text>
<text x="26" y="650"><tspan class="tvt-mono">VTABLE</tspan><tspan class="tvt-s13"> register’ını o kopyaya çevirir, girişi çalışma anında yazar ve ayrıca </tspan><tspan class="tvt-mono">IntEnable()</tspan><tspan class="tvt-s13"> çağırır.</tspan></text>
</svg>
