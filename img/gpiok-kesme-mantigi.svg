<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" class="gkm-svg" role="img" aria-labelledby="gkm-title gkm-desc">
<title id="gkm-title">GPIO kesme mantığı (Port F)</title>
<desc id="gkm-desc">Bir GPIO pininin kesme yolu: pin girişi, GPIOIS/GPIOIBE/GPIOIEV ile ayarlanan kenar/seviye algılayıcı, GPIORIS bitini (ham durum) kurar; GPIOIM biti ile VE işleminden GPIOMIS biti çıkar; portun 8 pininin MIS bitleri VEYA ile tek kesme hattında birleşir. NVIC’te kesme 30 (vektör 46) beklemeye girer (PEND0 bit 30); geçit 1 = GPIOIM, geçit 2 = EN0 bit 30, geçit 3 = PRIMASK; EN0 bit 30 ve PRI7 bit 23:21 önceliği, çekirdekte PRIMASK = 0 iken PortF_Handler çalışır. ISR’nin GPIOICR’ye 1 yazması RIS ve MIS bitini temizler (kenar tetiklemede; seviye tetiklemede ICR etkisizdir). Sağ altta Port A–F kesme numaraları.</desc>
