<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" class="stb-svg" role="img" aria-labelledby="stb-title stb-desc">
<title id="stb-title">SysTick blok yapısı</title>
<desc id="stb-desc">SysTick, Cortex-M4 çekirdeğinin içindeki 24 bitlik aşağı sayıcıdır; çevre birimi olmadığı için RCGC saat kapısı yoktur. Saat seçici STCTRL.CLK_SRC (bit 2) ile sürülür: 1 ise sistem saati (SysClk), 0 ise PIOSC 16 MHz’in 4’e bölünmüşü, 4 MHz. Seçilen saat, STCTRL.ENABLE (bit 0) ile VE kapısından geçerek sayıcıya ulaşır; ENABLE = 0 iken sayıcı durur. Sayıcının değeri STCURRENT (0xE000E018) register’ındadır ve her saatte 1 azalır. Sıfır algılama devresi sayıcının 0’a ulaştığını görür; bir sonraki saatte yükleme tetiği sayıcıya gider ve STRELOAD (0xE000E014) register’ındaki RELOAD değeri (bit 23:0) sayıcıya yüklenir. Sıfır algılama aynı anda STCTRL.COUNT bitini (bit 16) 1 yapar; COUNT, STCTRL okununca ya da STCURRENT’e yazılınca 0 olur ve yoklama ile izlenir. Sıfır algılama çıkışı STCTRL.INTEN (bit 1) ile VE’lenir; sonuç istisna 15 isteğidir ve öncelik ile PRIMASK uygunsa SysTick işleyicisi çalışır. Gri etiketlerdeki dört bit de STCTRL (0xE000E010) register’ındadır; reset değeri 0x0000.0004, yani CLK_SRC = 1.</desc>
<defs>
<marker id="stb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="stb-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="stb-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="stb-heada" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="stb-arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="stb-headm" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
