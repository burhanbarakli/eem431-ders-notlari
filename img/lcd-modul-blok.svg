<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 652" class="lcdm-svg" role="img" aria-labelledby="lcdm-title lcdm-desc">
<title id="lcdm-title">HD44780 karakter LCD modülünün içi</title>
<desc id="lcdm-desc">Solda mikrodenetleyici (TM4C123); RS, R/W, E denetim hatları ve DB7–DB0 veri yolu LCD modülündeki HD44780 denetleyicisinin arabirimine girer. RS = 0 iken bayt IR’ye (komut register’ı), RS = 1 iken DR’ye (veri register’ı) yazılır; E düşen kenarında alınır, R/W = 0 yazmadır. IR’deki konum komutu AC adres sayacını kurar; AC DDRAM ya da CGRAM adresini tutar; BF meşgul bayrağıdır. DR’deki karakter kodu, AC’nin gösterdiği adreste DDRAM’e (80 bayt, ekrandaki karakter kodları) yazılır. DDRAM’deki her kod CGROM’dan (hazır karakter desenleri) ya da CGRAM’den (kullanıcı tanımlı 8 karakter) 5×8 nokta deseni seçer (özel karakter tanımlarken DR’den CGRAM’e yazılır); desenler segment ve ortak sürücüler üzerinden 16×2 karakter paneline gider. V0 ucu 10 kΩ pot ile kontrastı ayarlar, A/K uçları 5 V / GND ile arka ışığı besler.</desc>
<defs>
<marker id="lcdm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="lcdm-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="lcdm-arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="lcdm-headm" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
