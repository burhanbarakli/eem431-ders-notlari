<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 642" class="nvz-svg" role="img" aria-labelledby="nvz-title nvz-desc">
<title id="nvz-title">Önalma, kuyruk zincirleme ve geç gelen kesme</title>
<desc id="nvz-desc">Üç zaman çizelgesi, öncelikler Örnek 10.1’deki gibi: Port F 1, Timer0A 5 (küçük sayı daha öncelikli). Üç şerit: Port F ISR’si, Timer0A ISR’si, ana program. Gri kutular donanım geçişidir; çevrim sayıları Workbook bölüm 4’ten. (a) Önalma: ana program çalışırken Timer0A isteği gelir, 12 çevrimde yığınlanır, Timer0A ISR’si başlar; Port F isteği gelince yeniden 12 çevrimde yığınlanır, Port F ISR’si çalışır, dönüşte (POP) Timer0A ISR’si kaldığı yerden sürer, onun dönüşünde ana programa geçilir. (b) Kuyruk zincirleme: Port F ISR’si çalışırken Timer0A isteği gelir ve bekler; Port F bitince geri yükleme ve yeniden yığınlama yapılmadan 6 çevrimde Timer0A ISR’sine geçilir. (c) Geç gelen: Timer0A isteği için yığınlama sürerken Port F isteği gelir; yığınlama kesilmeden tamamlanır (toplam 12 çevrim), vektör Port F’ye çevrilir ve önce Port F ISR’si çalışır, ardından 6 çevrimlik zincirleme ile bekleyen Timer0A ISR’si çalışır. Zaman ekseni ölçekli değildir.</desc>
<defs>
<pattern id="nvz-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="nvz-hatchl" d="M0,0 L0,7"/></pattern>
<marker id="nvz-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="nvz-heada" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="nvz-arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="nvz-headb" d="M0,0 L10,5 L0,10 z"/></marker>
