.lcda-svg .lcda-head{fill:var(--fig-stroke,#2b2b29)}
.lcda-svg .lcda-headm{fill:var(--fig-muted,#76746c)}
.lcda-svg .lcda-w{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.6}
.lcda-svg .lcda-wmd{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1.3;stroke-dasharray:4 3}
.lcda-svg .lcda-zone{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1.2;stroke-dasharray:4 4}
</style>
