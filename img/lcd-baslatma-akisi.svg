.lcda-svg .lcda-acc{fill:var(--fig-accent,#b4481f)}
.lcda-svg .lcda-num{fill:var(--fig-fill,#ffffff);font-weight:700;font-size:14px}
.lcda-svg .lcda-box{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5}
.lcda-svg .lcda-opt{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5;stroke-dasharray:6 4}
.lcda-svg .lcda-hl{fill:var(--fig-accent,#b4481f);fill-opacity:.14;stroke:var(--fig-accent,#b4481f);stroke-width:1.8}
