<text class="lcda-s13 lcda-mut" x="448" y="368">HD44780U akışı 11. adımda biter; 12. adım ekranı açar</text>
<path class="lcda-w" d="M360,460.0 L384,460.0 L384,112.0 L407,112.0" marker-end="url(#lcda-arr)"/>
<rect class="lcda-hl" x="396" y="396" width="348" height="73" rx="8"/>
