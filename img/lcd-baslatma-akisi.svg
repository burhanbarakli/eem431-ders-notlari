<text x="460" y="82"><tspan class="lcda-s13 lcda-mut">komutta </tspan><tspan class="lcda-mono">RS=0</tspan><tspan class="lcda-s13 lcda-mut">, veride </tspan><tspan class="lcda-mono">RS=1</tspan></text>
