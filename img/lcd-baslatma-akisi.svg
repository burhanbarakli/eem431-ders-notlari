<text x="68" y="357"><tspan class="lcda-mono lcda-b">0x3</tspan><tspan> yarım bayt + E darbesi; </tspan><tspan class="lcda-b">≥ 100 µs</tspan></text>
<rect class="lcda-box" x="28" y="386" width="332" height="40" rx="8"/>
<circle class="lcda-circ" cx="48" cy="406" r="12"/>
<text class="lcda-num" x="48" y="411" text-anchor="middle">6</text>
