<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 502" class="lcda-svg" role="img" aria-labelledby="lcda-title lcda-desc">
<title id="lcda-title">4 bitlik kipte LCD başlatma akışı</title>
<desc id="lcda-desc">On iki adım. GPIO hazırlığı: 1 Port B saati aç, PRGPIO hazır bekle; 2 PB0, PB1, PB4–PB7 çıkış + dijital. Tek yarım bayt (LCD kipi henüz belirsiz): 3 RS=0, E=0; en az 40 ms bekle; 4 0x3 yarım bayt + E darbesi, en az 4,1 ms; 5 0x3 yarım bayt + E darbesi, en az 100 µs; 6 0x3 yarım bayt + E darbesi, en az 40 µs; 7 0x2 yarım bayt + E darbesi → 4 bitlik kip. Tam bayt = iki yarım bayt (önce yüksek); komutta RS=0, veride RS=1: 8 0x28 Function set (4 bit, 2 satır, 5×8); 9 0x08 ekran kapalı; 10 0x01 ekranı sil, en az 1,64 ms; 11 0x06 giriş kipi (imleç sağa, kayma yok); 12 0x0C ekran açık (imleç istenirse 0x0E/0x0F), kesik çerçeveli: HD44780U akışı 11. adımda biter; 12. adım ekranı açar. Adım 4–6 notu: iç reset çalışmadıysa ya da yalnız MCU yeniden başladıysa LCD 4 bitlik kipte olabilir; üç kez 0x3 onu her durumda 8 bitlik kipe getirir.</desc>
<defs>
<marker id="lcda-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="lcda-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="lcda-arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="lcda-headm" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
