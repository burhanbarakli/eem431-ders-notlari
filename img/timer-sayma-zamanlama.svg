<rect class="tsz-hl" x="712" y="256" width="26" height="26" rx="3"/>
<text class="tsz-s13 tsz-mut" x="274" y="200" text-anchor="end">ICR = 1 → bayrak 0</text>
<path class="tsz-wm" d="M278,196 L296,212" marker-end="url(#tsz-arrm)"/>
<path class="tsz-wg" d="M120,334 L306,334 L306,308 L446,308 L446,334 L586,334 L586,308 L726,308 L726,334 L738,334"/>
