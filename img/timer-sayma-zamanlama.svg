<text class="tsz-s13 tsz-b" x="290" y="380" text-anchor="middle">T</text>
<path class="tsz-w" d="M430,356 L430,364"/>
<text class="tsz-s13 tsz-b" x="430" y="380" text-anchor="middle">2T</text>
<path class="tsz-w" d="M570,356 L570,364"/>
<text class="tsz-s13 tsz-b" x="570" y="380" text-anchor="middle">3T</text>
<path class="tsz-w" d="M710,356 L710,364"/>
<text class="tsz-s13 tsz-b" x="710" y="380" text-anchor="middle">4T</text>
<text class="tsz-it" x="738" y="380" text-anchor="end">t</text>
<rect class="tsz-code" x="12" y="396" width="736" height="66" rx="8"/>
<text x="26" y="422" xml:space="preserve"><tspan class="tsz-b tsz-it tsz-s16">T</tspan><tspan class="tsz-s16 tsz-b"> = (ILR + 1) / </tspan><tspan class="tsz-it tsz-s16 tsz-b">f</tspan><tspan class="tsz-sub tsz-b" dy="4">saat</tspan><tspan class="tsz-s13 tsz-mut" dy="-4">     sayaç ILR, ILR−1, …, 0 değerlerinden geçer: ILR + 1 saat çevrimi</tspan></text>
<text x="26" y="446" xml:space="preserve"><tspan class="tsz-s13">Örnek: 16 MHz, </tspan><tspan class="tsz-s13">ILR = 15 999 999</tspan><tspan class="tsz-s13"> → T = 16 000 000 / 16 MHz = </tspan><tspan class="tsz-b">1 s</tspan><tspan class="tsz-s13">  ·  LED 1 s yanık, 1 s sönük (2 s periyot)</tspan></text>
<rect class="tsz-box" x="12" y="484" width="736" height="118" rx="8"/>
<text x="26" y="506"><tspan class="tsz-b">Tek seferlik kip</tspan><tspan class="tsz-s13 tsz-mut"> (TAMR = 0x1)</tspan></text>
<path class="tsz-grid" d="M60,534 L330,534"/>
<path class="tsz-grid" d="M60,586 L330,586"/>
<text class="tsz-mono" x="54" y="539" text-anchor="end">ILR</text>
<text class="tsz-mono" x="54" y="591" text-anchor="end">0</text>
