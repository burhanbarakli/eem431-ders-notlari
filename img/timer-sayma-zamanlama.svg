<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" class="tsz-svg" role="img" aria-labelledby="tsz-title tsz-desc">
<title id="tsz-title">Periyodik zamanlayıcı zaman diyagramı</title>
<desc id="tsz-desc">Sayaç GPTMTAILR değerinden 0’a doğrusal iner, her zaman aşımında yeniden yüklenir (testere dişi, dört periyot). Her zaman aşımında TATORIS 1 olur; ISR ilk iş GPTMICR yazınca 0 olur, ardından LED’i tersler; LED periyodu zamanlayıcı periyodunun iki katıdır. T = (ILR + 1) / f_saat; 16 MHz ve ILR = 15 999 999 için T = 1 s. Altta tek seferlik kipte sayacın bir kez sayıp durması.</desc>
<defs>
<marker id="tsz-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="tsz-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="tsz-arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="tsz-headm" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
