<circle class="tsz-dot" cx="230" cy="586" r="4"/>
<text class="tsz-s13 tsz-b" x="240" y="582">durur</text>
<text class="tsz-s13 tsz-mut" x="94" y="528">TAEN = 1</text>
<text class="tsz-s13" x="352" y="534">ILR’den 0’a bir kez sayar; zaman aşımında TATORIS = 1 olur</text>
<text x="352" y="554"><tspan class="tsz-s13">ve donanım </tspan><tspan class="tsz-mono">TAEN</tspan><tspan class="tsz-s13">’i 0 yapar: sayaç durur.</tspan></text>
<text x="352" y="574"><tspan class="tsz-s13">Yeniden saymak için tekrar </tspan><tspan class="tsz-mono">TAEN = 1</tspan><tspan class="tsz-s13"> (</tspan><tspan class="tsz-mono">TimerEnable</tspan><tspan class="tsz-s13">).</tspan></text>
</svg>
