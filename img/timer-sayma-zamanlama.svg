.tsz-svg .tsz-grid{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:.8;stroke-dasharray:2 4}
.tsz-svg .tsz-mask{fill:var(--fig-fill,#ffffff);stroke:none}
</style>
<text class="tsz-s16 tsz-b" x="12" y="26">Periyodik kip, aşağı sayma (TAMR = 0x2, TACDIR = 0)</text>
<text class="tsz-s13 tsz-mut" x="748" y="26" text-anchor="end">ölçeksiz: ISR süresi abartılı</text>
<text x="12" y="119"><tspan class="tsz-b">Sayaç</tspan></text>
<text class="tsz-mono" x="12" y="136">GPTMTAR</text>
<text x="12" y="226"><tspan class="tsz-mono tsz-b">TATORIS</tspan></text>
<text x="12" y="274"><tspan class="tsz-b">ISR</tspan></text>
<text x="12" y="318"><tspan class="tsz-b">LED</tspan></text>
<text class="tsz-mono" x="12" y="335">PF1</text>
