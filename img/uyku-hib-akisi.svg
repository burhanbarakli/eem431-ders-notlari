<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" class="uha-svg" role="img" aria-labelledby="uha-title uha-desc">
<title id="uha-title">Hibernate’e giriş ve uyanış akışı</title>
<desc id="uha-desc">Adım numaraları veri sayfası 7.4.5 (RTC ya da harici uyanma) sırasıdır. Ön adım (numarasız): RCGCHIB ile modülün sistem saati; reset’te zaten açıktır (SysCtlPeripheralEnable). 1: HIBCTL = 0x40, CLK32EN ile 32,768 kHz osilatör açılır; kristalde tHIBOSC_START beklenir (HibernateEnableExpClk). LaunchPad adımı (numarasız): HIBCTL.VDD3ON = 1 ve RETCLR; kartta pil olmadığından VDD3ON kullanılır, pinler Hibernate boyunca tutulur (HibernateGPIORetentionEnable). 2: HIBRTCM0’a eşleşme değeri, HIBRTCSS.RTCSSM’e alt saniye eşleşmesi yazılır (HibernateRTCMatchSet(0, 5)). 3: HIBRTCLD’ye yükleme değeri yazılır; alt saniye sayacı sıfırlanır (HibernateRTCSet(0)); Lab 6 kodu 3’ü 2’den önce yapar. 4: saklanacak veri HIBDATA’ya yazılır (HibernateDataSet; Lab 6’da yok). Numarasız adım: HIBIC’e RTCALT0 ve EXTW yazılarak bekleyen bayraklar temizlenir; geçerli bir eşleşme bayrağı varken HIBREQ yazılırsa modül hemen uyanır (HibernateIntClear; Lab 6’da yok). 5: HIBCTL’de CLK32EN, RTCEN, RTCWEN, PINWEN ve HIBREQ 1 olur, yani 0x5B; VDD3ON ve RETCLR korunduğundan LaunchPad’de register değeri 0x4000.015B olur (HibernateRTCEnable, HibernateWakeSet, HibernateRequest); uyanma kaynağı yoksa HIBREQ yok sayılır. Her Hibernate register yazımından sonra HIBCTL.WRC = 1 beklenir. Ardından Hibernate: çekirdek ve çevre gücü kesilir, pinler tutulur, RTC sayar. Uyanma olayı: WAKE pini (LaunchPad’de SW2) ya da RTC eşleşmesi (HIBRTCC = HIBRTCM0). Güç geri gelir, normal güç açma reset’i olur; Hibernation modülü ve RTC sıfırlanmaz. main baştan çalışır ve uyanma nedenini okur: RESC’te POR (SysCtlResetCauseGet); HIBCTL.CLK32EN = 1 modülün açık olduğunu gösterir ama RESET düğmesinden sonra da 1’dir; HIBRIS’te EXTW (WAKE) ya da RTCALT0 (eşleşme) okunur ve HIBIC ile temizlenir; HIBDATA’dan durum geri yüklenir.</desc>
<defs>
<marker id="uha-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="uha-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="uha-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="uha-heada" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
