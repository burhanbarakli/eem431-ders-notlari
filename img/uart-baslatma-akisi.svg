<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 816" class="uba-svg" role="img" aria-labelledby="uba-title uba-desc">
<title id="uba-title">UART0 başlatma adımları</title>
<desc id="uba-desc">On dört adım, solda doğrudan register, sağda TivaWare: 1 UART saati RCGCUART (0x400F.E618) bit 0 ve hazır bekleme PRUART (0x400F.EA18), 2 GPIO Port A saati RCGCGPIO bit 0, 3 GPIOAFSEL |= 0x03, 4 GPIODEN |= 0x03, 5 GPIOPCTL alanları 0x11 (3–5: GPIOPinConfigure iki kez ve GPIOPinTypeUART), 6 UARTCTL.UARTEN = 0, 7 UARTIBRD = 27, 8 UARTFBRD = 8 (50 MHz, 115 200 baud), 9 UARTLCRH = 0x70 (WLEN 8 bit 0x60 + FEN 0x10), 10 isteğe bağlı UARTCC = 0x0 (sistem saati; 0x5 PIOSC seçilirse bölücü 16 MHz’e göre hesaplanır), 11 yalnız kesmeli UARTIFLS = 0x12, UARTICR = 0x50, UARTIM |= 0x50, 12 UARTCTL |= 0x301 (UARTEN, TXE, RXE), 13 NVIC EN0 bit 5 (IRQ 5, vektör 21), 14 CPSIE I. TivaWare’de 6–9 ve 12 tek UARTConfigSetExpClk çağrısıdır (UARTDisable, HSE seçimi, IBRD/FBRD, LCRH = 0x60, UARTEnable ile FEN = 1); UARTClockSourceSet ondan önce çağrılır ve PIOSC seçilirse saat olarak 16000000 verilir. İsteğe bağlı ve yalnız kesmeli adımlar kesik çizgili.</desc>
<style>
.uba-svg{font-family:"Source Sans 3",system-ui,sans-serif}
.uba-svg text{fill:var(--fig-stroke,#2b2b29);font-size:14px}
