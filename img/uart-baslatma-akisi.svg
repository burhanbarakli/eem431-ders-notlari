.uba-svg .uba-b{font-weight:700}
.uba-svg .uba-s13{font-size:13px}
.uba-svg .uba-s15{font-size:15px}
.uba-svg .uba-mut{fill:var(--fig-muted,#76746c)}
.uba-svg .uba-acc{fill:var(--fig-accent,#b4481f)}
.uba-svg .uba-blu{fill:var(--fig-blue,#1f5fa8)}
.uba-svg .uba-num{fill:var(--fig-fill,#ffffff);font-weight:700;font-size:14px}
.uba-svg .uba-box{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5}
.uba-svg .uba-opt{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5;stroke-dasharray:6 4}
