<text class="uba-num" x="16" y="59" text-anchor="middle">1</text>
<circle class="uba-circ" cx="16" cy="118" r="11"/>
<text class="uba-num" x="16" y="123" text-anchor="middle">2</text>
<circle class="uba-circ" cx="16" cy="166" r="11"/>
<text class="uba-num" x="16" y="171" text-anchor="middle">3</text>
<circle class="uba-circ" cx="16" cy="214" r="11"/>
<text class="uba-num" x="16" y="219" text-anchor="middle">4</text>
<circle class="uba-circ" cx="16" cy="262" r="11"/>
<text class="uba-num" x="16" y="267" text-anchor="middle">5</text>
<circle class="uba-circ" cx="16" cy="310" r="11"/>
<text class="uba-num" x="16" y="315" text-anchor="middle">6</text>
<circle class="uba-circ" cx="16" cy="358" r="11"/>
<text class="uba-num" x="16" y="363" text-anchor="middle">7</text>
<circle class="uba-circ" cx="16" cy="406" r="11"/>
