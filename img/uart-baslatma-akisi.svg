<circle class="uba-circ" cx="16" cy="582" r="11"/>
<text class="uba-num uba-s13" x="16" y="587" text-anchor="middle">11</text>
<circle class="uba-circ" cx="16" cy="662" r="11"/>
<text class="uba-num uba-s13" x="16" y="667" text-anchor="middle">12</text>
<circle class="uba-circ" cx="16" cy="710" r="11"/>
<text class="uba-num uba-s13" x="16" y="715" text-anchor="middle">13</text>
<circle class="uba-circ" cx="16" cy="758" r="11"/>
<text class="uba-num uba-s13" x="16" y="763" text-anchor="middle">14</text>
<text x="748" y="806" text-anchor="end"><tspan class="uba-s13 uba-mut">Sıra: datasheet §14.4; NVIC ve global izin UARTEN’den sonra. </tspan><tspan class="uba-s13 uba-mut">RCGCUART </tspan><tspan class="uba-mono uba-mut">0x400F.E618</tspan><tspan class="uba-s13 uba-mut"> · PRUART </tspan><tspan class="uba-mono uba-mut">0x400F.EA18</tspan></text>
</svg>
