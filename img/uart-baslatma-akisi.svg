.uba-svg .uba-tagacc{fill:var(--fig-accent,#b4481f);fill-opacity:.28;stroke:var(--fig-accent,#b4481f);stroke-width:1.2}
</style>
<rect class="uba-pill" x="30" y="6" width="344" height="26" rx="13"/>
<text class="uba-s15 uba-b" x="202" y="24" text-anchor="middle">API’siz — doğrudan register</text>
<rect class="uba-pill" x="386" y="6" width="362" height="26" rx="13"/>
<text class="uba-s15 uba-b" x="567" y="24" text-anchor="middle">API’li — TivaWare (driverlib)</text>
<rect class="uba-box" x="30" y="38" width="344" height="60" rx="6"/>
<text class="uba-b" x="50" y="56">Saat: RCGCUART + hazır bekle: PRUART</text>
<text class="uba-mono" x="50" y="74" xml:space="preserve">SYSCTL_RCGCUART_R |= 0x01;     // UART0</text>
<text class="uba-mono" x="50" y="90" xml:space="preserve">while(!(SYSCTL_PRUART_R &amp; 0x01));</text>
<rect class="uba-box" x="30" y="102" width="344" height="44" rx="6"/>
<text class="uba-b" x="50" y="120">GPIO portunun saati (Port A)</text>
<text class="uba-mono" x="50" y="138" xml:space="preserve">SYSCTL_RCGCGPIO_R |= 0x01;     // bit 0</text>
<rect class="uba-box" x="30" y="150" width="344" height="44" rx="6"/>
<text class="uba-b" x="50" y="168">Alternatif işlev: GPIOAFSEL</text>
<text class="uba-mono" x="50" y="186" xml:space="preserve">GPIO_PORTA_AFSEL_R |= 0x03;  // PA0,PA1</text>
<rect class="uba-box" x="30" y="198" width="344" height="44" rx="6"/>
<text class="uba-b" x="50" y="216">Sayısal etkin: GPIODEN</text>
<text class="uba-mono" x="50" y="234" xml:space="preserve">GPIO_PORTA_DEN_R |= 0x03;</text>
<rect class="uba-box" x="30" y="246" width="344" height="44" rx="6"/>
<text class="uba-b" x="50" y="264">Pin işlevi: GPIOPCTL alanı = 0x11</text>
<text class="uba-mono" x="50" y="282" xml:space="preserve">GPIO_PORTA_PCTL_R = (… &amp; ~0xFF) | 0x11;</text>
<rect class="uba-box" x="30" y="294" width="344" height="44" rx="6"/>
<text class="uba-b" x="50" y="312">UART’ı kapat: UARTEN = 0</text>
<text class="uba-mono" x="50" y="330" xml:space="preserve">UART0_CTL_R &amp;= ~0x01;</text>
<rect class="uba-box" x="30" y="342" width="344" height="44" rx="6"/>
<text class="uba-b" x="50" y="360">Baud tam kısmı: UARTIBRD</text>
<text class="uba-mono" x="50" y="378" xml:space="preserve">UART0_IBRD_R = 27;  // 50 MHz saat,</text>
<rect class="uba-box" x="30" y="390" width="344" height="44" rx="6"/>
<text class="uba-b" x="50" y="408">Baud kesir kısmı: UARTFBRD</text>
<text class="uba-mono" x="50" y="426" xml:space="preserve">UART0_FBRD_R = 8;   // 115 200 baud</text>
<rect class="uba-box" x="30" y="438" width="344" height="60" rx="6"/>
<text class="uba-b" x="50" y="456">Çerçeve: UARTLCRH (8N1 + FIFO)</text>
<text class="uba-mono" x="50" y="474" xml:space="preserve">UART0_LCRH_R = 0x70; // WLEN_8 | FEN</text>
<text class="uba-s13 uba-mut" x="50" y="490" xml:space="preserve">bölücü bu yazımla yürürlüğe girer</text>
<rect class="uba-opt" x="30" y="502" width="344" height="60" rx="6"/>
<text class="uba-b" x="50" y="520">Baud saati kaynağı: UARTCC</text>
<rect class="uba-pill" x="284" y="506" width="84" height="19" rx="9"/>
<text class="uba-s13 uba-b" x="326" y="520" text-anchor="middle">isteğe bağlı</text>
<text class="uba-mono" x="50" y="538" xml:space="preserve">UART0_CC_R = 0x0;   // sistem saati</text>
<text class="uba-mono" x="50" y="554" xml:space="preserve">// 0x5: PIOSC → bölücüyü 16 MHz’e göre</text>
<rect class="uba-opt" x="30" y="566" width="344" height="76" rx="6"/>
<text class="uba-b" x="50" y="584">Kesme: eşik, sil, maske</text>
<rect class="uba-tagacc" x="270" y="570" width="98" height="19" rx="9"/>
<text class="uba-s13 uba-b uba-acc" x="319" y="584" text-anchor="middle">yalnız kesmeli</text>
<text class="uba-mono" x="50" y="602" xml:space="preserve">UART0_IFLS_R = 0x12;  // RX ½, TX ½</text>
<text class="uba-mono" x="50" y="618" xml:space="preserve">UART0_ICR_R  = 0x50;  // RX|RT sil (=)</text>
<text class="uba-mono" x="50" y="634" xml:space="preserve">UART0_IM_R  |= 0x50;  // RXIM|RTIM</text>
<rect class="uba-box" x="30" y="646" width="344" height="44" rx="6"/>
<text class="uba-b" x="50" y="664">UART’ı aç: UARTEN | TXE | RXE</text>
<text class="uba-mono" x="50" y="682" xml:space="preserve">UART0_CTL_R |= 0x301;</text>
<rect class="uba-opt" x="30" y="694" width="344" height="44" rx="6"/>
<text class="uba-b" x="50" y="712">NVIC: IRQ 5’i aç</text>
<rect class="uba-tagacc" x="270" y="698" width="98" height="19" rx="9"/>
<text class="uba-s13 uba-b uba-acc" x="319" y="712" text-anchor="middle">yalnız kesmeli</text>
<text class="uba-mono" x="50" y="730" xml:space="preserve">NVIC_EN0_R = 1 &lt;&lt; 5;  // UART0</text>
<rect class="uba-opt" x="30" y="742" width="344" height="44" rx="6"/>
<text class="uba-b" x="50" y="760">Global kesmeleri aç</text>
<rect class="uba-tagacc" x="270" y="746" width="98" height="19" rx="9"/>
<text class="uba-s13 uba-b uba-acc" x="319" y="760" text-anchor="middle">yalnız kesmeli</text>
<text class="uba-mono" x="50" y="778" xml:space="preserve">__asm(" CPSIE I");</text>
<rect class="uba-code" x="386" y="38" width="362" height="60" rx="6"/>
<text class="uba-mono uba-blu" x="398" y="56" xml:space="preserve">SysCtlPeripheralEnable(SYSCTL_PERIPH_UART0);</text>
<text class="uba-mono uba-blu" x="398" y="72" xml:space="preserve">while(!SysCtlPeripheralReady(</text>
<text class="uba-mono uba-blu" x="398" y="88" xml:space="preserve">        SYSCTL_PERIPH_UART0));</text>
<path class="uba-con" d="M374,54 H386"/>
<rect class="uba-code" x="386" y="102" width="362" height="44" rx="6"/>
<text class="uba-mono uba-blu" x="398" y="120" xml:space="preserve">SysCtlPeripheralEnable(SYSCTL_PERIPH_GPIOA);</text>
<path class="uba-con" d="M374,118 H386"/>
<rect class="uba-code" x="386" y="150" width="362" height="140" rx="6"/>
<text class="uba-mono uba-blu" x="398" y="168" xml:space="preserve">GPIOPinConfigure(GPIO_PA0_U0RX);</text>
<text class="uba-mono uba-blu" x="398" y="184" xml:space="preserve">GPIOPinConfigure(GPIO_PA1_U0TX);  // PCTL</text>
<text class="uba-mono uba-blu" x="398" y="200" xml:space="preserve">GPIOPinTypeUART(GPIO_PORTA_BASE,</text>
<text class="uba-mono uba-blu" x="398" y="216" xml:space="preserve">    GPIO_PIN_0 | GPIO_PIN_1);</text>
<text class="uba-s13 uba-mut" x="398" y="232" xml:space="preserve">DIR=0, AFSEL=1, 2 mA, PUR=PDR=0, DEN=1</text>
<path class="uba-con" d="M374,166 H386"/>
<path class="uba-con" d="M374,214 H386"/>
<path class="uba-con" d="M374,262 H386"/>
<text class="uba-s13 uba-b" x="738" y="168" text-anchor="end">3–5</text>
<rect class="uba-codeopt" x="386" y="294" width="362" height="92" rx="6"/>
<text class="uba-s13 uba-b" x="398" y="312">adım 10 · isteğe bağlı</text>
<text class="uba-mono uba-blu" x="398" y="328" xml:space="preserve">UARTClockSourceSet(UART0_BASE,</text>
<text class="uba-mono uba-blu" x="398" y="344" xml:space="preserve">    UART_CLOCK_PIOSC);</text>
<text class="uba-s13 uba-mut" x="398" y="360" xml:space="preserve">UARTConfigSetExpClk’ten önce; PIOSC ise clk =</text>
<text class="uba-s13 uba-mut" x="398" y="376" xml:space="preserve">16000000 verilir (SysCtlClockGet() değil)</text>
<rect class="uba-code" x="386" y="390" width="362" height="140" rx="6"/>
<text class="uba-s13 uba-b" x="398" y="408">adım 6–9 + 12</text>
<text class="uba-mono uba-blu" x="398" y="424" xml:space="preserve">UARTConfigSetExpClk(UART0_BASE,</text>
<text class="uba-mono uba-blu" x="398" y="440" xml:space="preserve">  SysCtlClockGet(), 115200,</text>
<text class="uba-mono uba-blu" x="398" y="456" xml:space="preserve">  UART_CONFIG_WLEN_8|UART_CONFIG_STOP_ONE</text>
<text class="uba-mono uba-blu" x="398" y="472" xml:space="preserve">  | UART_CONFIG_PAR_NONE);</text>
<text class="uba-s13 uba-mut" x="398" y="488" xml:space="preserve">içi: UARTDisable → HSE → IBRD/FBRD → LCRH 0x60</text>
<text class="uba-s13 uba-mut" x="398" y="504" xml:space="preserve">→ UARTEnable: FEN = 1 (LCRH 0x70), CTL |= 0x301</text>
<rect class="uba-codeopt" x="386" y="534" width="362" height="156" rx="6"/>
<text class="uba-s13 uba-b" x="398" y="552">adım 11 · yalnız kesmeli</text>
<text class="uba-mono uba-blu" x="398" y="568" xml:space="preserve">UARTFIFOLevelSet(UART0_BASE,</text>
<text class="uba-mono uba-blu" x="398" y="584" xml:space="preserve">    UART_FIFO_TX4_8, UART_FIFO_RX4_8);</text>
<text class="uba-mono uba-blu" x="398" y="600" xml:space="preserve">UARTIntClear(UART0_BASE,</text>
<text class="uba-mono uba-blu" x="398" y="616" xml:space="preserve">    UART_INT_RX | UART_INT_RT);  // ICR = …</text>
<text class="uba-mono uba-blu" x="398" y="632" xml:space="preserve">UARTIntEnable(UART0_BASE,</text>
<text class="uba-mono uba-blu" x="398" y="648" xml:space="preserve">    UART_INT_RX | UART_INT_RT);  // IM |= …</text>
<text class="uba-s13 uba-mut" x="398" y="664" xml:space="preserve">UARTIntEnable bayrak silmez → önce UARTIntClear</text>
<rect class="uba-codeopt" x="386" y="694" width="362" height="44" rx="6"/>
<text class="uba-s13 uba-b" x="398" y="712">adım 13</text>
<text class="uba-mono uba-blu" x="398" y="728" xml:space="preserve">IntEnable(INT_UART0);    // vektör 21</text>
<path class="uba-con" d="M374,710 H386"/>
<rect class="uba-codeopt" x="386" y="742" width="362" height="44" rx="6"/>
<text class="uba-s13 uba-b" x="398" y="760">adım 14</text>
<text class="uba-mono uba-blu" x="398" y="776" xml:space="preserve">IntMasterEnable();</text>
<path class="uba-con" d="M374,758 H386"/>
<path class="uba-w" d="M16,65 V107"/>
<path class="uba-w" d="M16,129 V155"/>
<path class="uba-w" d="M16,177 V203"/>
<path class="uba-w" d="M16,225 V251"/>
