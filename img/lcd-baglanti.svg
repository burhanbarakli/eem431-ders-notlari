<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" class="lcdb-svg" role="img" aria-labelledby="lcdb-title lcdb-desc">
<title id="lcdb-title">LaunchPad ile LCD bağlantısı (4 bitlik kip)</title>
<desc id="lcdb-desc">EK-TM4C123GXL LaunchPad ile 16 pinli karakter LCD modülünün kablolaması. LCD pinleri sırayla: 1 VSS, 2 VDD, 3 V0, 4 RS, 5 R/W, 6 E, 7–10 D0–D3, 11–14 D4–D7, 15 A, 16 K. Denetim hatları: PB0 → RS, PB1 → E; veri hatları: PB4 → D4, PB5 → D5, PB6 → D6, PB7 → D7. R/W toprağa bağlıdır (yalnız yazma); D0–D3 bağlı değildir. VSS → GND, VDD → VBUS (+5 V). V0, uçları +5 V ve GND’ye bağlı 10 kΩ potun orta ucuna bağlanır (kontrast). A → +5 V (bazı modüllerde dış akım sınırlama direnci gerekir; modül veri sayfasına bakın), K → GND. Kart üstünde PB6 ile PD0 (R9) ve PB7 ile PD1 (R10) köprülüdür; PD0/PD1 çıkış yapılmamalıdır.</desc>
<defs>
<marker id="lcdb-arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="lcdb-headm" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
