<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 684" class="nvg-svg" role="img" aria-labelledby="nvg-title nvg-desc">
<title id="nvg-title">NVIC: çevre biriminden çekirdeğe kesme yolu</title>
<desc id="nvg-desc">Örnek an (Örnek 10.1): Timer0A ISR’si (IRQ 19, öncelik 5) çalışırken GPIO Port F isteği (IRQ 30, öncelik 1) gelir. Solda çevre birimleri: her biri kendi RIS ve IM bitlerinden MIS üretir ve tek bir kesme hattıyla NVIC’e bağlanır; TM4C123GH6PM’de 78 kesme vardır. Ortada NVIC: her IRQ için EN, PEND, ACTIVE bitleri ve PRI alanı. Satır 19: EN0 bit 19 = 1, PEND = 0, ACTIVE = 1, PRI4 bit 31:29 = 5. Satır 30: EN0 bit 30 = 1, PEND = 1, ACTIVE = 0, PRI7 bit 23:21 = 1. Seçici, EN = 1 ve PEND = 1 olanlar arasından en küçük öncelik numarasını (eşitlikte en küçük IRQ numarasını) seçer; burada tek bekleyen IRQ 30 kazanır. Karşılaştırma: bekleyen öncelik 1, geçerli yürütme önceliği 5’ten küçük olduğu için önalma olur. Geçerli yürütme önceliğini çekirdekteki etkin işleyici ve PRIMASK, BASEPRI, FAULTMASK maskeleri belirler. Çekirdek istisna girişinde sekiz kelimeyi (FPU bağlamı varsa 26) yığına iter, aynı anda vektör tablosundan VTABLE + 0x0B8 adresini okur, LR’ye EXC_RETURN yazar, PEND 30 sıfırlanır ve ACTIVE 30 kurulur; ardından Port F ISR’si çalışır. Altta sistem istisnaları: SysTick, PendSV, SVCall, Debug Monitor ve hata istisnaları SCB register’ları (INTCTRL, SYSPRI1–3, SYSHNDCTRL) üzerinden aynı seçiciye gelir; EN0–4, PEND0–4 ve PRI0–34’te bitleri yoktur. Reset, NMI ve HardFault sabit önceliklidir (−3, −2, −1).</desc>
<defs>
<marker id="nvg-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="nvg-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="nvg-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="nvg-heada" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
