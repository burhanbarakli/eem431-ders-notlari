<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" class="ulz-svg" role="img" aria-labelledby="ulz-title ulz-desc">
<title id="ulz-title">Workbook Lab 6 main2 zaman çizelgesi</title>
<desc id="ulz-desc">Ders kodu ile Workbook main2 aynıdır. Açılışta yeşil LED (PF3) yanar ve işlemci Run modunda SysCtlDelay(64 000 000) yazılım gecikmesinde bekler: döngü başına 3 çevrim varsayımıyla 64 000 000 × 3 / 40 MHz ≈ 4,8 s (Workbook yaklaşık 4 s der). Sonra HibernateRTCSet(0), HibernateRTCEnable, HibernateRTCMatchSet(0, 5) ve HibernateWakeSet çalışır, LED söner ve HibernateRequest ile Hibernate’e girilir. RTC LED sönmeden hemen önce 0’a yüklendiği için eşleşme yaklaşık 5 s sonra olur; güç gelir, POR olur ve main baştan çalışır, döngü tekrar eder. Hibernation modülü sıfırlanmadığından RTC uyanıştan sonra Run sırasında da saymayı sürdürür ve bir sonraki HibernateRTCSet(0) ile yeniden 0 olur. İkinci Hibernate’te SW2 (WAKE pini) basılınca erken uyanılır. VDD akımı kesik eksende: Run’da yaklaşık 21,9 mA (Lab 6 ölçümü, LED kapalıyken), Hibernate’te VDD3ON ve RTC açıkken 6,9 µA.</desc>
