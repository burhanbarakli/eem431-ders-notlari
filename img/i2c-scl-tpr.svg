<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" class="ist-svg" role="img" aria-labelledby="ist-title ist-desc">
<title id="ist-title">SCL üretimi: I2CMTPR ile SCL periyodu</title>
<desc id="ist-desc">Veri sayfası 16.3.2.1 ve I2CMTPR açıklamasına dayalı. SCL periyodu = 2 × (1 + TPR) × (SCL_LP + SCL_HP) sistem saati çevrimi; SCL_LP = 6 ve SCL_HP = 4 sabit olduğundan periyot 20 × (1 + TPR) çevrimdir. Bir birim 2 × (1 + TPR) çevrimdir: SCL 6 birim düşük, 4 birim yüksek kalır. Örnek: 16 MHz sistem saati (1 çevrim = 62,5 ns) ve TPR = 7 ile bir birim 16 çevrim (1 µs); düşük bölüm 6 × 16 = 96 çevrim = 6 µs, yüksek bölüm 4 × 16 = 64 çevrim = 4 µs; bir SCL periyodu 160 çevrim = 10 µs, yani 100 kHz. Ters yönde TPR = 16 000 000 / (20 × 100 000) − 1 = 7.</desc>
