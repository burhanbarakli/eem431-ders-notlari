<text x="590" y="196" text-anchor="middle"><tspan class="ist-s13 ist-b">yüksek: </tspan><tspan class="ist-m12 ist-b">SCL_HP</tspan><tspan class="ist-s13 ist-b"> = 4 birim</tspan></text>
