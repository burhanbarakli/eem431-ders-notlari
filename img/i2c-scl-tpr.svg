.ist-svg .ist-s16{font-size:16px}
.ist-svg .ist-mut{fill:var(--fig-muted,#76746c)}
.ist-svg .ist-code{fill:var(--fig-fill-2,#efece4);stroke:var(--fig-muted,#76746c);stroke-width:1.2}
.ist-svg .ist-wm{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1.4}
.ist-svg .ist-grid{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:.8;stroke-dasharray:2 4}
.ist-svg .ist-cell{fill:var(--fig-fill,#ffffff);stroke:var(--fig-muted,#76746c);stroke-width:1}
.ist-svg .ist-cellf{fill:var(--fig-fill-2,#efece4);stroke:var(--fig-muted,#76746c);stroke-width:1}
.ist-svg .ist-wva{fill:none;stroke:var(--fig-accent,#b4481f);stroke-width:2.2;stroke-linejoin:round}
