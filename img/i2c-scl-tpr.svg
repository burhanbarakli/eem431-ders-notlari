.ist-svg{font-family:"Source Sans 3",system-ui,sans-serif}
.ist-svg text{fill:var(--fig-stroke,#2b2b29);font-size:14px}
.ist-svg .ist-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-variant-ligatures:none}
.ist-svg .ist-m12{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-variant-ligatures:none}
