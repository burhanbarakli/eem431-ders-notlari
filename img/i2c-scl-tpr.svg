<text class="ist-s13" x="290" y="324" text-anchor="middle">6 × 16 = 96 çevrim = 6 µs</text>
<text class="ist-s13" x="590" y="324" text-anchor="middle">4 × 16 = 64 çevrim = 4 µs</text>
<path class="ist-wm" d="M112,340 L112,346 L708,346 L708,340"/>
<text x="410" y="366" text-anchor="middle" xml:space="preserve"><tspan class="ist-s13 ist-b">1 SCL periyodu = 20 × 8 = 160 çevrim = 10 µs  →  </tspan><tspan class="ist-s13 ist-b">100 kHz</tspan></text>
<text class="ist-s13 ist-b" x="16" y="412">1 birim, büyütülmüş:</text>
<text x="16" y="430"><tspan class="ist-s12">2 × (1 + </tspan><tspan class="ist-m12">TPR</tspan><tspan class="ist-s12">) = 16 çevrim</tspan></text>
