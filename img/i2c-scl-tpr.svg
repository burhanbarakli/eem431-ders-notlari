</style>
<text x="16" y="29"><tspan class="ist-s16 ist-b">SCL üretimi: </tspan><tspan class="ist-mono ist-b">I2CMTPR</tspan></text>
<text class="ist-s13 ist-mut" x="16" y="50">Veri sayfası 16.3.2.1 ve I2CMTPR açıklaması (s. 1003–1004, 1026).</text>
<rect class="ist-code" x="16" y="66" width="728" height="72" rx="8"/>
<text x="380" y="94" text-anchor="middle"><tspan class="ist-s15">SCL periyodu = 2 × (1 + </tspan><tspan class="ist-mono ist-b">TPR</tspan><tspan class="ist-s15">) × (</tspan><tspan class="ist-mono">SCL_LP</tspan><tspan class="ist-s15"> + </tspan><tspan class="ist-mono">SCL_HP</tspan><tspan class="ist-s15">) sistem saati çevrimi</tspan></text>
<text x="380" y="122" text-anchor="middle" xml:space="preserve"><tspan class="ist-m12">SCL_LP</tspan><tspan class="ist-s13"> = 6, </tspan><tspan class="ist-m12">SCL_HP</tspan><tspan class="ist-s13"> = 4 (sabit)  →  </tspan><tspan class="ist-s13 ist-b">periyot = 20 × (1 + </tspan><tspan class="ist-m12 ist-b">TPR</tspan><tspan class="ist-s13 ist-b">) çevrim</tspan></text>
<text x="16" y="168" xml:space="preserve"><tspan class="ist-s13 ist-b">Örnek: </tspan><tspan class="ist-s13">16 MHz (1 çevrim = 62,5 ns), </tspan><tspan class="ist-m12 ist-b">TPR</tspan><tspan class="ist-s13 ist-b"> = 7</tspan><tspan class="ist-s13">  →  1 birim = 2 × (1 + 7) = 16 çevrim = 1 µs</tspan></text>
<path class="ist-wm" d="M112,210 L112,204 L468,204 L468,210"/>
<path class="ist-wm" d="M472,210 L472,204 L708,204 L708,210"/>
