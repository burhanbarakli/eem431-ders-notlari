<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 514" class="lcdd-svg" role="img" aria-labelledby="lcdd-title lcdd-desc">
<title id="lcdd-title">16×2 LCD’de DDRAM adresleri</title>
<desc id="lcdd-desc">16×2 ızgara: satır 1 hücrelerinin DDRAM adresleri 00…0F, satır 2 hücrelerininki 40…4F (onaltılık). İmleci satır başına taşımak için DDRAM adres komutu 0x80 adresle VEYA’lanır: 0x80 | 0x00 = 0x80 (satır 1), 0x80 | 0x40 = 0xC0 (satır 2). Örnek: gotoxy(2,4) satır 2, sütun 4 hücresidir; adresi 0x43, komutu 0x80 | 0x43 = 0xC3. Altta: her satır 40 karakterlik sanal satırdır (satır 1: 0x00–0x27, satır 2: 0x40–0x67); ekran yalnız 16 sütunluk pencereyi gösterir. 0x18 komutu yazıyı sola kaydırır (pencere bir sütun sağa gider), 0x1C yazıyı sağa kaydırır (pencere bir sütun sola gider).</desc>
<defs>
<marker id="lcdd-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="lcdd-heada" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
