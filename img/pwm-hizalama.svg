<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" class="pwmh-svg" role="img" aria-labelledby="pwmh-title pwmh-desc">
<title id="pwmh-title">Aynı sayaçla dört GENA ayarı: sola, sağa, ters çevirme ve merkez hizalı</title>
<desc id="pwmh-desc">Sayaç LOAD = 319, PWM saati 8 MHz (1 tık = 125 ns). Üstte aşağı sayma (MODE = 0): periyot 320 tık = 40 µs. (a) GENA = 0x8C, CMPA = 239: LOAD’da yüksek, CMPA aşağıda düşük; darbe periyodun başında, 80 tık, sola hizalı %25. (b) GENA = 0xC8, CMPA = 79: LOAD’da düşük, CMPA aşağıda yüksek; darbe periyodun sonunda, 80 tık, sağa hizalı %25. (c) GENA = 0x70, CMPA = 79: ACTCMPAU = 3 ama aşağı sayma kipinde CMPA yukarı olayı hiç oluşmaz; yalnız ACTCMPAD = 1 (ters çevir) çalışır. Çıkış her periyotta bir kez ters döner: %50 görev oranı, periyot 640 tık = 80 µs, 12,5 kHz; CMPA yalnız kenarların yerini belirler (başlangıç düzeyi düşük varsayıldı). Altta yukarı/aşağı sayma (MODE = 1), aynı LOAD = 319: sayaç 0’dan 319’a çıkar, 0’a iner; periyot 2 × 319 = 638 tık ≈ 79,8 µs. (d) GENA = 0xB0, CMPA = 239: CMPA yukarıda yüksek, CMPA aşağıda düşük; darbe tepe noktasına göre ortalanır, 2 × (319 − 239) = 160 tık = 20 µs, ≈ %25. Bu, TivaWare PWMGenConfigure’ün yukarı/aşağı kipte GENA’ya yazdığı değerdir.</desc>
