<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" class="sz-svg" role="img" aria-labelledby="sz-title sz-desc">
<title id="sz-title">Aynı SysTick ayarının farklı sistem saatlerindeki etkisi</title>
<desc id="sz-desc">SysTick: RELOAD = 10.000.000 − 1, saat kaynağı sistem saati; döngü COUNT bayrağını sayar, her 8 bayrakta bir LED’i (PF2) değiştirir (dersteki API’siz örnek kod). Bayrak aralığı = 10.000.000 / f. Ortak zaman ekseni 0–10 s. 16 MHz: bayrak her 0,625 s, LED her 5 s değişir. 40 MHz: bayrak her 0,25 s, LED her 2 s değişir. 80 MHz: bayrak her 0,125 s, LED her 1 s değişir. Kod aynı kalırken saat 5 kat artınca LED 5 kat hızlı yanıp söner.</desc>
