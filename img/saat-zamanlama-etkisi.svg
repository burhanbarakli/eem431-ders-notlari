.sz-svg .sz-acc{fill:var(--fig-accent,#b4481f)}
.sz-svg .sz-blu{fill:var(--fig-blue,#1f5fa8)}
.sz-svg .sz-w{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.6}
.sz-svg .sz-wt{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.2}
.sz-svg .sz-wa{fill:none;stroke:var(--fig-accent,#b4481f);stroke-width:1.8}
.sz-svg .sz-wb{fill:none;stroke:var(--fig-blue,#1f5fa8);stroke-width:2}
.sz-svg .sz-wm{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1.4}
.sz-svg .sz-grid{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:.8;stroke-dasharray:2 4}
</style>
<text class="sz-s16 sz-b" x="16" y="29">Aynı SysTick ayarı, üç farklı sistem saati</text>
<text x="16" y="51"><tspan class="sz-mono">RELOAD</tspan><tspan class="sz-s13"> = 10.000.000 − 1, SysTick saati = SysClk; her 8 </tspan><tspan class="sz-mono">COUNT</tspan><tspan class="sz-s13"> bayrağında LED (PF2) değişir</tspan></text>
<text x="16" y="92" xml:space="preserve"><tspan class="sz-b sz-s15">16 MHz</tspan><tspan class="sz-s13">   bayrak her 10.000.000 / 16 MHz = </tspan><tspan class="sz-s13 sz-b">0,625 s</tspan><tspan class="sz-s13">   ·   LED her 8 × 0,625 = </tspan><tspan class="sz-s13 sz-b sz-acc">5 s</tspan><tspan class="sz-s13"> değişir</tspan></text>
