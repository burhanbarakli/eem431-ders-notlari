<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" class="nvy-svg" role="img" aria-labelledby="nvy-title nvy-desc">
<title id="nvy-title">İstisna yığın çerçevesi ve EXC_RETURN</title>
<desc id="nvy-desc">Veri sayfası Şekil 2-7’ye dayalı. Yukarısı yüksek adres; yığın aşağı doğru büyür. Girişten sonra SP çerçevenin en düşük adresini, yani R0’ı gösterir. FPU bağlamı yokken çerçeve 8 kelimedir (32 bayt): SP+0x00 R0, +0x04 R1, +0x08 R2, +0x0C R3, +0x10 R12, +0x14 LR, +0x18 PC (dönüş adresi), +0x1C xPSR. FPU bağlamı varken ardından S0–S15 (+0x20 … +0x5C), FPSCR (+0x60) ve ayrılmış bir kelime (+0x64) gelir: toplam 26 kelime (104 bayt). Çerçevenin üstüne, SP’yi 8 bayta hizalamak için isteğe bağlı bir dolgu kelimesi eklenebilir (kesikli); eklendiyse yığındaki xPSR’nin bit 9’u 1 olur (CFGCTRL.STKALIGN = 1, reset değeri). Girişte LR’ye EXC_RETURN yazılır (değerler notta). ISR bu değeri PC’ye yüklediğinde (BX LR, POP {…, PC}) dönüş başlar.</desc>
<defs>
<marker id="nvy-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="nvy-head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
