<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 708" class="nvd-svg" role="img" aria-labelledby="nvd-title nvd-desc">
<title id="nvd-title">Bir kesmenin durumları; darbe ve seviye kesmesi</title>
<desc id="nvd-desc">Üstte durum makinesi. Etkin değil (inactive: PEND 0, ACTIVE 0) → istek (hat, PEND ya da SWTRIG yazımı) → Bekliyor (pending: PEND 1, ACTIVE 0) → giriş (öncelik yeterli) → Etkin (active: PEND 0, ACTIVE 1) → dönüş, hat 0 ve yeni darbe yoksa → Etkin değil; dönüşte seviye hattı hâlâ 1 ise doğrudan Bekliyor’a döner. Etkin iken yeni darbe ya da PEND yazımı gelirse (seviye kesmesi ISR sürerken bekler duruma geçmez) Etkin ve bekliyor (active and pending: PEND 1, ACTIVE 1) olur; dönüşte Bekliyor’a geçer ve ISR’ye yeniden girilir. Bekliyor durumundan UNPEND yazımıyla (isteğe bağlı, kesikli) Etkin değil’e dönülebilir. Altta iki zaman satırı. (a) Darbe kesmesi: ilk darbe bekleme bitini kurar, girişte bit silinir; ISR sürerken gelen iki darbe tek bir bekleme olarak kilitlenir, dönüşte ISR bir kez daha çalışır, sonra etkin değil olur. (b) Seviye kesmesi, kaynak bayrağı ISR’de temizlenmiyor: hat 1 kalır, her dönüşte NVIC hattı yeniden örnekler ve kesme hemen bekliyor olur; ISR sonsuza dek tekrarlanır, ana program ilerlemez.</desc>
<defs>
<pattern id="nvd-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="nvd-hatchl" d="M0,0 L0,7"/></pattern>
<marker id="nvd-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="nvd-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="nvd-arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="nvd-headm" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
