<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" class="icr-svg" role="img" aria-labelledby="icr-title icr-desc">
<title id="icr-title">I2C çerçevesi: köle 0x55’e tek bayt (A = 0x41) yazma</title>
<desc id="icr-desc">SCL ve SDA dalga biçimi. Boşta iki hat da yüksek. START: SCL yüksekken SDA düşer. Ardından 7 bit köle adresi 0x55 = 101 0101, MSB önce (A6 … A0 = 1, 0, 1, 0, 1, 0, 1), sonra R/W̅ biti 0 (yaz); hatta giden ilk bayt 0xAA = 1010 1010. Dokuzuncu saatte master SDA’yı bırakır, köle SDA’yı 0’a çekerek ACK verir. Sonra veri baytı 0x41 = ‘A’ = 0100 0001, MSB önce (D7 … D0 = 0, 1, 0, 0, 0, 0, 0, 1), yine köleden ACK (0). STOP: SCL yüksekken SDA yükselir. SCL’yi her zaman master üretir. SDA yalnız SCL düşükken değişir; SCL yüksekken sabit kalır ve alıcı bu sırada okur. Renk: turuncu = master sürer, yeşil = köle sürer. Bu çerçeveyi I2CMSA ← 0xAA, I2CMDR ← 0x41, I2CMCS ← 0x07 komutu üretir. SCL 6:4 oranında düşük:yüksek kalır (TM4C’de SCL_LP = 6, SCL_HP = 4). 100 kbps’te bir bit 10 µs sürer.</desc>
