<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" class="amb-svg" role="img" aria-labelledby="amb-title amb-desc">
<title id="amb-title">ADC modülü blok şeması</title>
<desc id="amb-desc">Sadeleştirilmiş ADC modülü (datasheet Şekil 13-1/13-2’nin yeniden çizimi): AIN0–AIN11 ve iç sıcaklık sensörü TS analog çoklayıcıya, oradan örnekle-tut devresine, 12-bit SAR dönüştürücüye (VREFP = VDDA, VREFN = GNDA) ve ADCSAC ile ayarlanan donanım ortalayıcıya gider; sonuç etkin sıralayıcının FIFO’suna yazılır. Dört örnekleme sıralayıcısı: SS0 8 adım/8 derinlikli FIFO, SS1 ve SS2 4/4, SS3 1/1; her biri ADCSSMUXn, ADCSSCTLn, ADCSSFIFOn içerir ve etkin adımın MUXk/TSk alanı çoklayıcının kanalını seçer. Tetik kaynakları (işlemci ADCPSSI 0x0, analog karşılaştırıcı 0x1/0x2, GPIO 0x4, zamanlayıcı 0x5, PWM 0x6–0x9, sürekli 0xF) ADCEMUX’un EM0–EM3 alanlarıyla her sıralayıcı için ayrı seçilir. Öncelik ADCSSPRI, etkinleştirme ADCACTSS. Kesme yolu ADCRIS → ADCIM → ADCISC → NVIC (ADC0 SS0–3 IRQ 14–17, ADC1 IRQ 48–51); ayrıca IE olayından μDMA burst isteği (maskeden bağımsız). ADC0 0x4003.8000, ADC1 0x4003.9000, 12-bit, en çok 1 Msps.</desc>
<defs>
<marker id="amb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="amb-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="amb-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="amb-heada" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
