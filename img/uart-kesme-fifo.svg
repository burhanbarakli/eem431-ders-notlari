<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" class="ukf-svg" role="img" aria-labelledby="ukf-title ukf-desc">
<title id="ukf-title">UART FIFO’ları ve kesme eşikleri</title>
<desc id="ukf-desc">Solda: 16 girdilik RX FIFO ve UARTIFLS.RXIFLSEL (bit 5:3) eşikleri: 0x0 = 1/8 (2 bayt), 0x1 = 1/4 (4), 0x2 = 1/2 (8, açılış değeri), 0x3 = 3/4 (12), 0x4 = 7/8 (14); FIFO eşiğe ulaşınca RXRIS kalkar. Sağ üstte: alma zaman aşımı (RT): FIFO boş değilken 32 bit süresi (HSE = 1 ise 64) yeni veri gelmezse RTRIS kalkar; eşiğe ulaşmayan son baytlar böylece okunur. Sağ altta: TX FIFO ve TXIFLSEL açılış değeri 1/2; seviye eşiğin altına inerken TXRIS kalkar.</desc>
<defs>
<marker id="ukf-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ukf-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ukf-ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ukf-heada" d="M0,0 L10,5 L0,10 z"/></marker>
