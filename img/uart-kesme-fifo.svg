<text x="312" y="196"><tspan class="ukf-s13">Eşiğe ulaşmayan son baytlar (ör. 5 bayt &lt; ½ = 8) RXRIS kaldırmaz;</tspan></text>
<text x="312" y="218"><tspan class="ukf-s13">RT bunları okutur; IM’de ikisi de açılır: </tspan><tspan class="ukf-mono ukf-blu">UART_INT_RX | UART_INT_RT</tspan></text>
