<text class="ukf-s15" x="170" y="243">¼</text>
<text class="ukf-s13" x="188" y="243">≥ 4 bayt</text>
<path class="ukf-thr" d="M60,266 H130"/>
<text class="ukf-mono" x="136" y="271">0x0</text>
<text class="ukf-s15" x="170" y="271">⅛</text>
<text class="ukf-s13" x="188" y="271">≥ 2 bayt</text>
<text class="ukf-s13" x="16" y="336">Eşiğe ulaşınca (≥)* RXRIS = 1; eşiğin altına</text>
<text class="ukf-s13" x="16" y="352">okununca ya da RXIC = 1 ile silinir.</text>
