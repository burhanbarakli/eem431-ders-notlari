<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 706" class="gkb-svg" role="img" aria-labelledby="gkb-title gkb-desc">
<title id="gkb-title">GPIO kesmesi başlatma akışı: register ile ve TivaWare ile</title>
<desc id="gkb-desc">On adım: Port F saati (RCGCGPIO bit 5, PRGPIO bekleme); yalnız PF0 için kilit açma (GPIOLOCK = 0x4C4F434B, GPIOCR); GPIODIR ve GPIODEN; GPIOPUR iç çekme direnci (TivaWare’de GPIOPinTypeGPIOInput’tan sonra); GPIOIM ile maskeleme; GPIOIS, GPIOIBE, GPIOIEV ile düşen kenar seçimi; GPIOICR ile eski bayrakları silme; GPIOIM ile maskeyi açma (datasheet §10.3 adım 7, not a–d); NVIC: isteğe bağlı öncelik 5 (PRI7 bit 23:21) ve EN0 bit 30; CPSIE I ile global izin. Sağ sütunda karşılık gelen TivaWare çağrıları; koşullu ve isteğe bağlı kısımlar kesik çizgili.</desc>
<defs>
<marker id="gkb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="gkb-head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<style>
.gkb-svg{font-family:"Source Sans 3",system-ui,sans-serif}
.gkb-svg text{fill:var(--fig-stroke,#2b2b29);font-size:14px}
.gkb-svg .gkb-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-variant-ligatures:none}
.gkb-svg .gkb-b{font-weight:700}
.gkb-svg .gkb-s13{font-size:13px}
.gkb-svg .gkb-s15{font-size:15px}
.gkb-svg .gkb-mut{fill:var(--fig-muted,#76746c)}
.gkb-svg .gkb-blu{fill:var(--fig-blue,#1f5fa8)}
.gkb-svg .gkb-num{fill:var(--fig-fill,#ffffff);font-weight:700;font-size:14px}
.gkb-svg .gkb-box{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5}
.gkb-svg .gkb-opt{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5;stroke-dasharray:6 4}
.gkb-svg .gkb-code{fill:var(--fig-fill-2,#efece4);stroke:var(--fig-muted,#76746c);stroke-width:1.2}
.gkb-svg .gkb-codeo{fill:var(--fig-fill-2,#efece4);stroke:var(--fig-muted,#76746c);stroke-width:1.2;stroke-dasharray:6 4}
.gkb-svg .gkb-pill{fill:var(--fig-fill-2,#efece4);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.2}
.gkb-svg .gkb-circ{fill:var(--fig-accent,#b4481f)}
.gkb-svg .gkb-head{fill:var(--fig-stroke,#2b2b29)}
.gkb-svg .gkb-w{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.6}
.gkb-svg .gkb-con{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1.2;stroke-dasharray:3 3}
</style>
<rect class="gkb-pill" x="16" y="10" width="356" height="30" rx="15"/>
<text class="gkb-s15 gkb-b" x="194" y="30" text-anchor="middle">API’siz — doğrudan register</text>
<rect class="gkb-pill" x="380" y="10" width="364" height="30" rx="15"/>
<text class="gkb-s15 gkb-b" x="562" y="30" text-anchor="middle">API’li — TivaWare (driverlib)</text>
<rect class="gkb-box" x="16" y="48" width="356" height="46" rx="8"/>
<circle class="gkb-circ" cx="36" cy="64" r="12"/>
<text class="gkb-num" x="36" y="69" text-anchor="middle">1</text>
<text class="gkb-b" x="56" y="69">Saat: RCGCGPIO (0x400F.E608), PRGPIO bekle</text>
<text class="gkb-mono" x="56" y="85" xml:space="preserve">SYSCTL_RCGCGPIO_R |= 0x20;  // bit 5</text>
<rect class="gkb-code" x="380" y="48" width="364" height="46" rx="8"/>
<text class="gkb-mono gkb-blu" x="390" y="69">SysCtlPeripheralEnable(SYSCTL_PERIPH_GPIOF);</text>
<text class="gkb-mono gkb-blu" x="390" y="85">while(!SysCtlPeripheralReady(…)){}</text>
<path class="gkb-con" d="M372,64 L380,64"/>
<path class="gkb-w" d="M194.0,94 L194.0,103" marker-end="url(#gkb-arr)"/>
<rect class="gkb-opt" x="16" y="104" width="356" height="46" rx="8"/>
<circle class="gkb-circ" cx="36" cy="120" r="12"/>
<text class="gkb-num" x="36" y="125" text-anchor="middle">2</text>
<text class="gkb-b" x="56" y="125">Koşullu — yalnız PF0: kilidi aç</text>
<text class="gkb-mono" x="56" y="141">GPIOLOCK = 0x4C4F434B; GPIOCR |= 0x01;</text>
<rect class="gkb-codeo" x="380" y="104" width="364" height="46" rx="8"/>
<text class="gkb-mono gkb-blu" x="390" y="125">HWREG(… + GPIO_O_LOCK) = GPIO_LOCK_KEY;</text>
<text class="gkb-mono gkb-blu" x="390" y="141">HWREG(… + GPIO_O_CR) |= 0x01; // API yok</text>
<path class="gkb-con" d="M372,120 L380,120"/>
<path class="gkb-w" d="M194.0,150 L194.0,159" marker-end="url(#gkb-arr)"/>
<rect class="gkb-box" x="16" y="160" width="356" height="46" rx="8"/>
<circle class="gkb-circ" cx="36" cy="176" r="12"/>
<text class="gkb-num" x="36" y="181" text-anchor="middle">3</text>
<text class="gkb-b" x="56" y="181">Yön ve sayısal: PF4, PF0 giriş; PF1–3 çıkış</text>
<text class="gkb-mono" x="56" y="197" xml:space="preserve">GPIODIR = 0x0E;  GPIODEN |= 0x1F;</text>
<rect class="gkb-code" x="380" y="160" width="364" height="46" rx="8"/>
<text class="gkb-mono gkb-blu" x="390" y="181">GPIOPinTypeGPIOInput(GPIO_PORTF_BASE, …);</text>
<text class="gkb-mono gkb-blu" x="390" y="197">GPIOPinTypeGPIOOutput(GPIO_PORTF_BASE, …);</text>
<path class="gkb-con" d="M372,176 L380,176"/>
<path class="gkb-w" d="M194.0,206 L194.0,215" marker-end="url(#gkb-arr)"/>
<rect class="gkb-box" x="16" y="216" width="356" height="62" rx="8"/>
<circle class="gkb-circ" cx="36" cy="232" r="12"/>
<text class="gkb-num" x="36" y="237" text-anchor="middle">4</text>
<text class="gkb-b" x="56" y="237">İç çekme direnci: GPIOPUR</text>
<text class="gkb-mono" x="56" y="253">GPIO_PORTF_PUR_R |= 0x11;</text>
<rect class="gkb-code" x="380" y="216" width="364" height="62" rx="8"/>
<text class="gkb-mono gkb-blu" x="390" y="237">GPIOPadConfigSet(…, GPIO_STRENGTH_2MA,</text>
<text class="gkb-mono gkb-blu" x="390" y="253" xml:space="preserve">  GPIO_PIN_TYPE_STD_WPU);</text>
<text x="390" y="269"><tspan class="gkb-s13 gkb-mut">Input’tan sonra (Input PUR’u sıfırlar)</tspan></text>
<path class="gkb-con" d="M372,232 L380,232"/>
<path class="gkb-w" d="M194.0,278 L194.0,287" marker-end="url(#gkb-arr)"/>
<rect class="gkb-box" x="16" y="288" width="356" height="46" rx="8"/>
<circle class="gkb-circ" cx="36" cy="304" r="12"/>
<text class="gkb-num" x="36" y="309" text-anchor="middle">5</text>
<text class="gkb-b" x="56" y="309">Maskele: GPIOIM bitleri 0 (§10.3 7a)</text>
<text class="gkb-mono" x="56" y="325">GPIO_PORTF_IM_R &amp;= ~0x11;</text>
<rect class="gkb-code" x="380" y="288" width="364" height="46" rx="8"/>
<text class="gkb-mono gkb-blu" x="390" y="309">GPIOIntDisable(GPIO_PORTF_BASE,</text>
<text class="gkb-mono gkb-blu" x="390" y="325" xml:space="preserve">  GPIO_INT_PIN_4 | GPIO_INT_PIN_0);</text>
<path class="gkb-con" d="M372,304 L380,304"/>
<path class="gkb-w" d="M194.0,334 L194.0,343" marker-end="url(#gkb-arr)"/>
<rect class="gkb-box" x="16" y="344" width="356" height="78" rx="8"/>
<circle class="gkb-circ" cx="36" cy="360" r="12"/>
<text class="gkb-num" x="36" y="365" text-anchor="middle">6</text>
<text class="gkb-b" x="56" y="365">Tür: GPIOIS, GPIOIBE, GPIOIEV (§10.3 7b)</text>
<text class="gkb-mono" x="56" y="381" xml:space="preserve">GPIO_PORTF_IS_R  &amp;= ~0x11; // kenar</text>
<text class="gkb-mono" x="56" y="397">GPIO_PORTF_IBE_R &amp;= ~0x11; // tek kenar</text>
<text class="gkb-mono" x="56" y="413">GPIO_PORTF_IEV_R &amp;= ~0x11; // düşen</text>
<rect class="gkb-code" x="380" y="344" width="364" height="78" rx="8"/>
<text class="gkb-mono gkb-blu" x="390" y="365">GPIOIntTypeSet(GPIO_PORTF_BASE,</text>
<text class="gkb-mono gkb-blu" x="390" y="381" xml:space="preserve">  GPIO_PIN_4 | GPIO_PIN_0,</text>
<text class="gkb-mono gkb-blu" x="390" y="397" xml:space="preserve">  GPIO_FALLING_EDGE);</text>
<path class="gkb-con" d="M372,360 L380,360"/>
<path class="gkb-w" d="M194.0,422 L194.0,431" marker-end="url(#gkb-arr)"/>
<rect class="gkb-box" x="16" y="432" width="356" height="46" rx="8"/>
<circle class="gkb-circ" cx="36" cy="448" r="12"/>
<text class="gkb-num" x="36" y="453" text-anchor="middle">7</text>
<text class="gkb-b" x="56" y="453">Eski bayrakları sil: GPIOICR (§10.3 7c)</text>
<text class="gkb-mono" x="56" y="469" xml:space="preserve">GPIO_PORTF_ICR_R = 0x11;   // W1C</text>
<rect class="gkb-code" x="380" y="432" width="364" height="46" rx="8"/>
<text class="gkb-mono gkb-blu" x="390" y="453">GPIOIntClear(GPIO_PORTF_BASE,</text>
<text class="gkb-mono gkb-blu" x="390" y="469" xml:space="preserve">  GPIO_INT_PIN_4 | GPIO_INT_PIN_0);</text>
<path class="gkb-con" d="M372,448 L380,448"/>
<path class="gkb-w" d="M194.0,478 L194.0,487" marker-end="url(#gkb-arr)"/>
<rect class="gkb-box" x="16" y="488" width="356" height="46" rx="8"/>
<circle class="gkb-circ" cx="36" cy="504" r="12"/>
<text class="gkb-num" x="36" y="509" text-anchor="middle">8</text>
<text class="gkb-b" x="56" y="509">Maskeyi aç: GPIOIM (§10.3 7d)</text>
<text class="gkb-mono" x="56" y="525">GPIO_PORTF_IM_R |= 0x11;</text>
<rect class="gkb-code" x="380" y="488" width="364" height="46" rx="8"/>
<text class="gkb-mono gkb-blu" x="390" y="509">GPIOIntEnable(GPIO_PORTF_BASE,</text>
<text class="gkb-mono gkb-blu" x="390" y="525" xml:space="preserve">  GPIO_INT_PIN_4 | GPIO_INT_PIN_0);</text>
<path class="gkb-con" d="M372,504 L380,504"/>
<path class="gkb-w" d="M194.0,534 L194.0,543" marker-end="url(#gkb-arr)"/>
<rect class="gkb-box" x="16" y="544" width="356" height="98" rx="8"/>
<circle class="gkb-circ" cx="36" cy="560" r="12"/>
<text class="gkb-num" x="36" y="565" text-anchor="middle">9</text>
<text x="56" y="565"><tspan class="gkb-b">NVIC: </tspan><tspan class="gkb-s13">önce öncelik, sonra </tspan><tspan class="gkb-mono gkb-b">EN0</tspan><tspan class="gkb-b"> bit 30</tspan></text>
<rect class="gkb-opt" x="50" y="573" width="312" height="38" rx="5"/>
<text x="58" y="588"><tspan class="gkb-s13 gkb-b">isteğe bağlı — öncelik 5: </tspan><tspan class="gkb-mono">PRI7</tspan><tspan class="gkb-s13"> bit 23:21</tspan></text>
<text class="gkb-mono" x="58" y="604">NVIC_PRI7_R |= 0x00A00000;</text>
<text class="gkb-mono" x="56" y="631" xml:space="preserve">NVIC_EN0_R = 1 &lt;&lt; 30;  // 0x40000000</text>
<rect class="gkb-code" x="380" y="544" width="364" height="98" rx="8"/>
<rect class="gkb-codeo" x="386" y="573" width="352" height="38" rx="5"/>
<text class="gkb-s13 gkb-b gkb-mut" x="394" y="588">isteğe bağlı</text>
<text class="gkb-mono gkb-blu" x="394" y="604" xml:space="preserve">IntPrioritySet(INT_GPIOF, 0xA0);  // 5</text>
<text class="gkb-mono gkb-blu" x="390" y="631" xml:space="preserve">IntEnable(INT_GPIOF);  // 46 = 30 + 16</text>
<path class="gkb-con" d="M372,560 L380,560"/>
<path class="gkb-w" d="M194.0,642 L194.0,651" marker-end="url(#gkb-arr)"/>
<rect class="gkb-box" x="16" y="652" width="356" height="46" rx="8"/>
<circle class="gkb-circ" cx="36" cy="668" r="12"/>
<text class="gkb-num" x="36" y="673" text-anchor="middle">10</text>
<text class="gkb-b" x="56" y="673">Global izin: PRIMASK = 0</text>
<text class="gkb-mono" x="56" y="689">__asm(" CPSIE I");</text>
<rect class="gkb-code" x="380" y="652" width="364" height="46" rx="8"/>
<text class="gkb-mono gkb-blu" x="390" y="673">IntMasterEnable();</text>
<path class="gkb-con" d="M372,668 L380,668"/>
</svg>
