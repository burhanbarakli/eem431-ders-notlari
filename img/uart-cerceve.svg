<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 664" class="ucr-svg" role="img" aria-labelledby="ucr-title ucr-desc">
<title id="ucr-title">UART çerçevesi (8N1) zaman diyagramı</title>
<desc id="ucr-desc">Boşta hat yüksek (1). Başlangıç biti 0, ardından D0…D7 veri bitleri LSB önce, sonra durma biti 1 ve yeniden boşta. Örnek karakter A = 0x41 = 0100 0001 ikili; hatta sırayla 1, 0, 0, 0, 0, 0, 1, 0 gider. Bir bit süresi T_bit = 1/baud: 9 600 baud için 104,17 µs, 115 200 baud için 8,68 µs. 8N1 çerçevesi 10 bit olduğundan 9 600 baud en çok 960 karakter/s taşır. Alıcı her bitin ortasında örnekler: 16 kat aşırı örneklemede (HSE = 0) düşen kenardan sonra Baud16’nın 8. tıkında hat hâlâ 0 ise başlangıç biti geçerlidir, sonraki bitler her 16 tıkta bir örneklenir (datasheet §14.3.3). Eşlik açıksa (PEN = 1) D7 ile durma biti arasına eşlik biti girer; çift eşlikte A için P = 0.</desc>
