<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" class="dev-svg" role="img" aria-labelledby="dev-title dev-desc">
<title id="dev-title">LaunchPad RGB LED ve buton devreleri</title>
<desc id="dev-desc">(a) PF1, PF2, PF3 pinleri dahili dirençli NPN transistörler (DTC114E) üzerinden ortak anotlu RGB LED'in katotlarını 330 ohm dirençlerle GND'ye çeker; pin 1 iken LED yanar. (b) SW1 PF4'e, SW2 PF0'a bağlıdır ve basılınca pini GND'ye çeker; kartta harici pull-up yoktur, GPIOPUR ile iç pull-up açılır; basılı 0, bırakılmış 1 okunur.</desc>
<defs>
<marker id="dev-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="dev-head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="dev-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0342c"/></marker>
<marker id="dev-arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker>
<marker id="dev-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e4f"/></marker>
</defs>
<style>
.dev-svg{font-family:"Source Sans 3",system-ui,sans-serif}
.dev-svg text{fill:var(--fig-stroke,#2b2b29);font-size:14px}
.dev-svg .dev-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-variant-ligatures:none}
.dev-svg .dev-b{font-weight:700}
.dev-svg .dev-s13{font-size:13px}
.dev-svg .dev-s15{font-size:15px}
.dev-svg .dev-mut{fill:var(--fig-muted,#76746c)}
.dev-svg .dev-acc{fill:var(--fig-accent,#b4481f)}
.dev-svg .dev-ctl{fill:var(--fig-blue,#1f5fa8)}
.dev-svg .dev-head{fill:var(--fig-stroke,#2b2b29)}
.dev-svg .dev-w{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.dev-svg .dev-thick{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:3}
.dev-svg .dev-dot{fill:var(--fig-stroke,#2b2b29)}
.dev-svg .dev-term{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5}
.dev-svg .dev-mcu{fill:var(--fig-fill-2,#efece4);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5}
.dev-svg .dev-pkg{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1.2;stroke-dasharray:5 3}
.dev-svg .dev-qc{fill:var(--fig-fill,#ffffff);stroke:var(--fig-stroke,#2b2b29);stroke-width:1.5}
.dev-svg .dev-pin{fill:var(--fig-accent,#b4481f)}
.dev-svg .dev-sep{stroke:var(--fig-muted,#76746c);stroke-width:1;stroke-dasharray:3 4}
</style>

<!-- ================= (a) LED sürme ================= -->
<text class="dev-s15 dev-b" x="16" y="28">(a) RGB LED sürme</text>

<!-- +VBUS rayı -->
<circle class="dev-term" cx="56" cy="72" r="4"/>
<path class="dev-w" d="M60,72 H370"/>
<text class="dev-b" x="44" y="58">+VBUS <tspan class="dev-s13 dev-mut" font-weight="400">(USB, ≈5 V)</tspan></text>
<text class="dev-s13 dev-mut" x="420" y="58" text-anchor="end">D1: ortak anotlu RGB LED</text>
<circle class="dev-dot" cx="150" cy="72" r="3"/>
<circle class="dev-dot" cx="260" cy="72" r="3"/>

<!-- Kanal şablonu: ch = 150 (kırmızı), 260 (mavi), 370 (yeşil) -->
<g id="dev-ch1">
