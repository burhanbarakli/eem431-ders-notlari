<text class="dev-s13 dev-b" x="560" y="69">3,3 V</text>
<text class="dev-s13" x="550" y="98">iç pull-up</text>
<text class="dev-s13 dev-mut" x="550" y="114">13–30 kΩ</text>
<text class="dev-mono dev-ctl" x="550" y="131">GPIOPUR=1</text>
<circle class="dev-dot" cx="540" cy="150" r="3"/>
<path class="dev-w" d="M540,150 H626"/>
<path class="dev-w" d="M540,150 H526"/>
