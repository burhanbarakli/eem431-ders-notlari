<text class="dev-s13" x="692" y="211" text-anchor="middle">bırakılmış → 1</text>
</g>

<!-- Satır 2: SW2 / PF0, r = 290 -->
<g>
<path class="dev-w" d="M528,204 H552 M540,204 V226 l5,3 l-10,6 l10,6 l-10,6 l10,6 l-10,6 l5,3 V290"/>
<text class="dev-s13 dev-b" x="560" y="209">3,3 V</text>
<text class="dev-s13" x="550" y="238">iç pull-up</text>
<text class="dev-s13 dev-mut" x="550" y="254">13–30 kΩ</text>
<text class="dev-mono dev-ctl" x="550" y="271">GPIOPUR=1</text>
