<path class="dev-w" d="M724,302 H748 M728,307 H744 M732,312 H740"/>
<text class="dev-s13" x="692" y="334" text-anchor="middle">basılı → 0</text>
<text class="dev-s13" x="692" y="351" text-anchor="middle">bırakılmış → 1</text>
</g>

<text class="dev-s13" x="490" y="382">Kartta harici pull-up direnci yok:</text>
<text class="dev-s13" x="490" y="400"><tspan class="dev-mono dev-ctl">GPIOPUR</tspan> ile iç pull-up açılmalı</text>
<text class="dev-s13" x="490" y="424"><tspan class="dev-mono dev-acc dev-b">PF0</tspan> kilitli: önce <tspan class="dev-mono">GPIOLOCK</tspan> + <tspan class="dev-mono">GPIOCR</tspan></text>
<text class="dev-s13 dev-mut" x="490" y="448">SW2 ayrıca R8 (330 Ω) ile WAKE pinine bağlı</text>
</svg>
