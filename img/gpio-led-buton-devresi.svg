<path class="dev-w" d="M634,290 H669 M715,290 H736 V302"/>
<circle class="dev-term" cx="672" cy="290" r="3"/>
<circle class="dev-term" cx="712" cy="290" r="3"/>
<path class="dev-w" d="M666,280 H718 M692,280 V270 M684,270 H700"/>
