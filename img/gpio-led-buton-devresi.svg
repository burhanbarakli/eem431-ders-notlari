<!-- MCU (a) -->
<rect class="dev-mcu" x="40" y="318" width="400" height="40" rx="4"/>
<rect class="dev-pin" x="66" y="314" width="8" height="8"/>
<rect class="dev-pin" x="176" y="314" width="8" height="8"/>
<rect class="dev-pin" x="286" y="314" width="8" height="8"/>
<text class="dev-mono dev-b dev-acc" x="70" y="342" text-anchor="middle">PF1</text>
<text class="dev-mono dev-b dev-acc" x="180" y="342" text-anchor="middle">PF2</text>
<text class="dev-mono dev-b dev-acc" x="290" y="342" text-anchor="middle">PF3</text>
<text class="dev-s13 dev-b" x="430" y="343" text-anchor="end">TM4C123GH6PM</text>

<text x="16" y="390"><tspan class="dev-mono dev-b">PFx = 1</tspan> → transistör iletimde → LED <tspan class="dev-b">yanar</tspan></text>
<text x="16" y="410"><tspan class="dev-mono dev-b">PFx = 0</tspan> → transistör kesimde → LED söner</text>
<text class="dev-s13 dev-mut" x="16" y="434">Q1–Q3: DTC114EET1G, dahili 10 kΩ + 10 kΩ dirençli NPN</text>
<text class="dev-s13 dev-mut" x="16" y="452">Katotlar 330 Ω (R3–R5) üzerinden transistörlere bağlı</text>

<line class="dev-sep" x1="476" y1="16" x2="476" y2="456"/>

<!-- ================= (b) Butonlar ================= -->
<text class="dev-s15 dev-b" x="490" y="28">(b) Butonlar (aktif düşük)</text>
<rect class="dev-pkg" x="488" y="44" width="142" height="304" rx="6"/>
<text class="dev-s13 dev-mut" x="622" y="340" text-anchor="end">MCU içi</text>

<!-- Satır 1: SW1 / PF4, r = 150 -->
