<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" class="sty-svg" role="img" aria-labelledby="sty-title sty-desc">
<title id="sty-title">Yoklama ve kesme: aynı SysTick periyodu, farklı işlemci kullanımı</title>
<desc id="sty-desc">Ortak zaman ekseni 0–2 s. Örnek: 16 MHz sistem saati, RELOAD = 3 999 999 (16 000 000 / 4 − 1); sarma her 4 000 000 / 16 MHz = 0,25 s’de bir, 2 s içinde 8 kez. Üst satır yoklama (INTEN = 0): işlemci sürekli STCTRL’yi okuyan döngüdedir, COUNT = 0 okundukça tekrar eder; her sarmada if gövdesi kısa bir süre çalışır. Alt satır kesme (INTEN = 1): işlemci ana döngüde başka işe serbesttir; her sarmada kısa bir işleyici çalışır. İşleyicide a sayacı 1, 2, 3, 4 olur; 4’te mavi LED (PF2) ters çevrilir ve a = 0 yapılır. Her iki yöntemde LED 1 s’de bir değişir: 0–1 s sönük, 1–2 s yanık, 2 s’de yeniden söner. Süreler ölçeksizdir; if gövdesi ve işleyici abartılı genişlikte çizilmiştir.</desc>
