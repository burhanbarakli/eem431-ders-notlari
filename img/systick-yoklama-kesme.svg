.sty-svg text{fill:var(--fig-stroke,#2b2b29);font-size:14px}
.sty-svg .sty-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-variant-ligatures:none}
.sty-svg .sty-m12{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-variant-ligatures:none}
.sty-svg .sty-b{font-weight:700}
.sty-svg .sty-s12{font-size:12px}
.sty-svg .sty-s13{font-size:13px}
.sty-svg .sty-s16{font-size:16px}
.sty-svg .sty-mut{fill:var(--fig-muted,#76746c)}
.sty-svg .sty-acc{fill:var(--fig-accent,#b4481f)}
.sty-svg .sty-pulse{fill:var(--fig-accent,#b4481f);stroke:var(--fig-accent,#b4481f);stroke-width:1}
.sty-svg .sty-barb{fill:var(--fig-blue,#1f5fa8);fill-opacity:.28}
.sty-svg .sty-barm{fill:var(--fig-muted,#76746c);fill-opacity:.28}
.sty-svg .sty-w{fill:none;stroke:var(--fig-stroke,#2b2b29);stroke-width:1.6}
.sty-svg .sty-wa{fill:none;stroke:var(--fig-accent,#b4481f);stroke-width:1.8}
.sty-svg .sty-wb{fill:none;stroke:var(--fig-blue,#1f5fa8);stroke-width:2}
.sty-svg .sty-wm{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:1.4}
.sty-svg .sty-grid{fill:none;stroke:var(--fig-muted,#76746c);stroke-width:.8;stroke-dasharray:2 4}
</style>
